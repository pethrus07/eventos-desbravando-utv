/* ---------- pendências por pessoa (campos obrigatórios — fácil de ajustar aqui) ----------
   v4.17: "valor" saiu daqui — financeiro de participante não-staff é gerido
   só em Financeiro > Contas a Receber (que já tem seu próprio status/pendências). */
var OBRIG_PART = [
  { rot:"CPF",      falta:function(c){ return !String(c.cpf||"").trim(); } },
  { rot:"telefone", falta:function(c){ return !String(c.telefone||"").trim(); } },
  { rot:"camisa",   falta:function(c){ return !String(c.camiseta||"").trim(); } },
  { rot:"UTV",      falta:function(c){ return c.papel!=="acompanhante" && !String(c.utv||"").trim(); } },
  { rot:"contrato", falta:function(c){ return !c.contrato_assinado; } }
];
var OBRIG_CRM = [
  { rot:"telefone", falta:function(c){ return !String(c.telefone||"").trim(); } },
  { rot:"CPF",      falta:function(c){ return !String(c.cpf||"").trim(); } },
  { rot:"camisa",   falta:function(c){ return !String(c.camiseta||"").trim(); } },
  { rot:"cidade",   falta:function(c){ return !String(c.cidade||"").trim(); } }
];
function pendencias(obj, regras){ var r=[]; regras.forEach(function(x){ if(x.falta(obj)) r.push(x.rot); }); return r; }
function chipFalta(obj, regras){ var f=pendencias(obj,regras); return f.length ? '<span class="chip bad">⚠ Pendência</span>' : ''; }
function avisoFalta(obj, regras){ var f=pendencias(obj,regras); return f.length ? '<div class="aviso-falta">⚠ Faltando nesta pessoa: <b>'+f.join(", ")+'</b></div>' : ''; }

/* v4.39: extraído de renderParticipantes pra ser reaproveitado pelo Painel
   Geral (mesma regra, um evento por vez em vez do evento aberto). */
function calcParticipantesStats(clientes){
  var adultos=0, criancas=0, utv4=0, utv2=0, comPend=0, staff=0, custoStaff=0, desistencias=0, ativos=0;
  // v4.45: recebimento/devolução é por UTV (piloto), não por participante —
  // mesma regra do utv4/utv2 acima, pra não duplicar quando o acompanhante
  // do mesmo grupo é contado junto.
  var utvRecebidos=0, utvFaltamReceber=0, utvDevolvidos=0, utvAguardandoDevolucao=0;
  (clientes||[]).forEach(function(c){
    if (c.desistente){ desistencias++; return; }
    ativos++;
    if (c.staff){ staff++; if (c.pacote!=null) custoStaff += c.pacote; }
    else if (pendencias(c, OBRIG_PART).length) comPend++;
    if (c.tipo==="crianca") criancas++; else adultos++;
    // UTV é do piloto — contar acompanhante duplicaria o mesmo veículo.
    if (c.papel!=="acompanhante"){
      if (c.utv==="4 lugares") utv4++;
      if (c.utv==="2 lugares") utv2++;
      if (c.utv==="4 lugares" || c.utv==="2 lugares"){
        if (c.utv_recebido) utvRecebidos++; else utvFaltamReceber++;
        if (c.utv_devolvido) utvDevolvidos++; else utvAguardandoDevolucao++;
      }
    }
  });
  return { total: ativos, adultos: adultos, criancas: criancas, staff: staff, custoStaff: custoStaff,
    comPend: comPend, desistencias: desistencias, utv4: utv4, utv2: utv2,
    utvRecebidos: utvRecebidos, utvFaltamReceber: utvFaltamReceber,
    utvDevolvidos: utvDevolvidos, utvAguardandoDevolucao: utvAguardandoDevolucao };
}
/* v4.41: controle de capacidade das cegonhas. Capacidade cai de 11 pra 10
   quando a própria cegonha já tem 5+ UTVs de 4 lugares. Sempre mostra pelo
   menos a Cegonha 01; e sempre uma cegonha "seguinte" vazia quando a
   última já estiver cheia (ou não houver nenhuma ainda) — é assim que se
   "abre" a próxima, sem precisar de um botão/lançamento à parte. */
function capacidadeCegonha(d){ return d.utv4 >= 5 ? 10 : 11; }
/* v4.41: participante sem cegonha definida (todo o cadastro anterior a essa
   funcionalidade, por exemplo) não fica de fora da contagem — ele preenche
   automaticamente a partir da Cegonha 01, na mesma ordem em que aparece em
   Participantes, respeitando a capacidade dinâmica de cada cegonha e
   avançando pra próxima (criando novas se preciso) só quando a atual lota.
   Quem já tem cegonha escolhida manualmente nunca é remanejado por esse
   preenchimento automático. */
function calcCegonhas(clientes){
  var pilotos = (clientes||[]).filter(function(c){
    return !c.desistente && c.papel!=="acompanhante" && (c.utv==="4 lugares" || c.utv==="2 lugares");
  });
  var porCegonha = {}, maxUsado = 0;
  var semCegonha = [];
  pilotos.forEach(function(c){
    if (!c.cegonha){ semCegonha.push(c); return; }
    var n = c.cegonha;
    if (!porCegonha[n]) porCegonha[n] = { utv4:0, utv2:0 };
    if (c.utv==="4 lugares") porCegonha[n].utv4++; else porCegonha[n].utv2++;
    if (n > maxUsado) maxUsado = n;
  });
  var n = 1;
  semCegonha.forEach(function(c){
    if (!porCegonha[n]) porCegonha[n] = { utv4:0, utv2:0 };
    while ((porCegonha[n].utv4+porCegonha[n].utv2) >= capacidadeCegonha(porCegonha[n])){
      n++;
      if (!porCegonha[n]) porCegonha[n] = { utv4:0, utv2:0 };
    }
    if (c.utv==="4 lugares") porCegonha[n].utv4++; else porCegonha[n].utv2++;
    if (n > maxUsado) maxUsado = n;
  });
  var qtd = Math.max(maxUsado, 1);
  var linhas = [];
  for (var i=1; i<=qtd; i++){
    var d = porCegonha[i] || { utv4:0, utv2:0 };
    var capacidade = capacidadeCegonha(d);
    var total = d.utv4 + d.utv2;
    linhas.push({ numero:i, utv4:d.utv4, utv2:d.utv2, total:total, capacidade:capacidade, disponiveis: capacidade-total });
  }
  var ultima = linhas[linhas.length-1];
  if (ultima.disponiveis <= 0) linhas.push({ numero:qtd+1, utv4:0, utv2:0, total:0, capacidade:11, disponiveis:11 });
  return linhas;
}
function cegonhasHtml(linhas, imp){
  if (imp){
    return '<div class="grp-title" style="margin-top:18px">Cegonhas</div>' +
      linhas.map(function(x){
        var cls = x.disponiveis<0 ? 'bad' : (x.disponiveis===0 ? 'warn' : 'ok');
        return '<div class="grupo-nome" style="font-size:12px;margin-top:10px">Cegonha '+String(x.numero).padStart(2,'0')+'</div>' +
          '<div class="kpis">' +
            kpiHtmlImp('4L', x.utv4) + kpiHtmlImp('2L', x.utv2) + kpiHtmlImp('Total', x.total) +
            kpiHtmlImp('Capacidade', x.capacidade) + kpiHtmlImp('Disponíveis', x.disponiveis, '', cls) +
          '</div>';
      }).join('');
  }
  return '<label class="top">Cegonhas</label>' +
    linhas.map(function(x){
      var cor = x.disponiveis<0 ? 'var(--p1)' : (x.disponiveis===0 ? 'var(--warn)' : 'var(--ok)');
      return '<div class="row" style="cursor:default">' +
        '<div class="info"><div class="nm">Cegonha '+String(x.numero).padStart(2,'0')+'</div>' +
        '<div class="sub">' +
          '<span>4L: <span class="vl">'+x.utv4+'</span></span>' +
          '<span>2L: <span class="vl">'+x.utv2+'</span></span>' +
          '<span>Total: <span class="vl">'+x.total+'</span></span>' +
          '<span>Capacidade: <span class="vl">'+x.capacidade+'</span></span>' +
          '<span>Disponíveis: <span class="vl" style="color:'+cor+'">'+x.disponiveis+'</span></span>' +
        '</div></div></div>';
    }).join('');
}
function renderParticipantes(){
  var d = calcParticipantesStats(CL);
  var html =
    painelParticipantesHtml(d, calcCegonhas(CL)) +

    '<div class="tabs" style="margin-bottom:12px">' +

      '<button class="tab'+(PFILT.tipo==="adulto"?' on':'')+'" data-pf="adulto">Adultos</button>' +

      '<button class="tab'+(PFILT.pend?' on':'')+'" data-pf="pend">Com pendências ('+d.comPend+')</button>' +
      '<button class="tab'+(PFILT.desistencias?' on':'')+'" data-pf="desistencias">Desistências ('+d.desistencias+')</button>' +
    '</div>';

  // v4.45: filtros de recebimento/devolução do UTV — linha própria, só aparece
  // se a expedição já tem UTV cadastrado (senão é ruído sem uso).
  if (d.utv4+d.utv2){
    html += '<div class="tabs" style="margin-bottom:12px">' +
      '<button class="tab'+(PFILT.utv==="recebido"?' on':'')+'" data-pfutv="recebido">UTV recebido ('+d.utvRecebidos+')</button>' +
      '<button class="tab'+(PFILT.utv==="pendente_recebimento"?' on':'')+'" data-pfutv="pendente_recebimento">Pendente de recebimento ('+d.utvFaltamReceber+')</button>' +
      '<button class="tab'+(PFILT.utv==="devolvido"?' on':'')+'" data-pfutv="devolvido">UTV devolvido ('+d.utvDevolvidos+')</button>' +
      '<button class="tab'+(PFILT.utv==="aguardando_devolucao"?' on':'')+'" data-pfutv="aguardando_devolucao">Aguardando devolução ('+d.utvAguardandoDevolucao+')</button>' +
    '</div>';
  }

  if (!CL.length) html += '<div class="empty">Nenhum participante. Adicione o primeiro abaixo.</div>';
  html += '<div id="p_lista"></div>' +
    '<button class="btn" id="p_add" style="width:100%;margin-top:14px">+ Adicionar participante</button>';
  $("main").innerHTML = html;
  desenharListaClientes();
  var ptt = $("pt_toggle"); if (ptt) ptt.onclick = function(){ PART_PAINEL_ABERTO = !PART_PAINEL_ABERTO; renderParticipantes(); };
  var pte = $("pt_export"); if (pte) pte.onclick = function(){
    escolherExportacaoPDF('Participantes',
      function(){ exportarParticipantesPDF(); },
      function(){ exportarParticipantesPDF(true); });
  };
  $("p_q").oninput = debounce(function(){ PFILT.q = this.value.toLowerCase(); desenharListaClientes(); }, 200);
  Array.prototype.forEach.call(document.querySelectorAll("[data-pf]"), function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-pf");
      if (v==="all"){ PFILT.tipo=""; PFILT.pend=false; PFILT.staff=false; PFILT.desistencias=false; }
      else if (v==="pend"){ PFILT.pend=!PFILT.pend; PFILT.desistencias=false; }
      else if (v==="staff"){ PFILT.staff=!PFILT.staff; PFILT.desistencias=false; }
      else if (v==="desistencias"){ PFILT.desistencias=!PFILT.desistencias; PFILT.tipo=""; PFILT.pend=false; PFILT.staff=false; }
      else { PFILT.tipo = PFILT.tipo===v ? "" : v; PFILT.desistencias=false; }
      renderParticipantes();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-pfutv]"), function(b){
    b.onclick = function(){
      var v = b.getAttribute("data-pfutv");
      PFILT.utv = PFILT.utv===v ? "" : v;
      renderParticipantes();
    };
  });
  $("p_add").onclick = function(){ sheetCliente(null); };
}

/* Mesmo filtro/agrupamento usado na lista da tela — reaproveitado também na
   exportação em PDF, pra garantir que os dois sempre batem. */
function agruparClientesFiltrados(){
  var q = PFILT.q;
  var grupos = {};
  CL.forEach(function(c){
    if (PFILT.desistencias ? !c.desistente : !!c.desistente) return;
    if (q && (c.nome+" "+c.grupo+" "+c.cpf+" "+c.telefone).toLowerCase().indexOf(q)<0) return;
    if (PFILT.tipo==="adulto" && c.tipo==="crianca") return;
    if (PFILT.tipo==="crianca" && c.tipo!=="crianca") return;
    if (PFILT.pend && (c.staff || !pendencias(c, OBRIG_PART).length)) return;
    if (PFILT.staff && !c.staff) return;
    if (PFILT.utv){
      var temUtvF = c.papel!=="acompanhante" && (c.utv==="4 lugares" || c.utv==="2 lugares");
      if (!temUtvF) return;
      if (PFILT.utv==="recebido" && !c.utv_recebido) return;
      if (PFILT.utv==="pendente_recebimento" && c.utv_recebido) return;
      if (PFILT.utv==="devolvido" && !c.utv_devolvido) return;
      if (PFILT.utv==="aguardando_devolucao" && c.utv_devolvido) return;
    }
    var g = c.grupo || "Sem grupo";
    (grupos[g]=grupos[g]||[]).push(c);
  });
  // dentro de cada grupo (mesmo UTV/reserva), piloto sempre primeiro, acompanhantes depois.
  Object.keys(grupos).forEach(function(g){
    grupos[g].sort(function(a,b){ return (a.papel==="acompanhante"?1:0)-(b.papel==="acompanhante"?1:0); });
  });
  return grupos;
}
function descricaoFiltroParticipantes(){
  var partes = [];
  if (PFILT.desistencias) partes.push("Desistências");
  if (PFILT.tipo==="adulto") partes.push("Adultos");
  if (PFILT.tipo==="crianca") partes.push("Crianças");
  if (PFILT.staff) partes.push("Staff");
  if (PFILT.pend) partes.push("Com pendências");
  if (PFILT.utv==="recebido") partes.push("UTV recebido");
  if (PFILT.utv==="pendente_recebimento") partes.push("Pendente de recebimento");
  if (PFILT.utv==="devolvido") partes.push("UTV devolvido");
  if (PFILT.utv==="aguardando_devolucao") partes.push("Aguardando devolução");
  if (PFILT.q) partes.push('Busca: "'+PFILT.q+'"');
  return partes.length ? partes.join(" · ") : "Todos os participantes ativos";
}
function desenharListaClientes(){
  var grupos = agruparClientesFiltrados();
  var h = "";
  Object.keys(grupos).sort().forEach(function(g){
    h += '<h3 class="anton" style="font-size:16px;margin:16px 0 8px;color:var(--mut)">'+esc(g)+'</h3>';
    grupos[g].forEach(function(c){
      var ehPiloto = c.papel!=="acompanhante";
      var temUtv = ehPiloto && (c.utv==="4 lugares" || c.utv==="2 lugares");
      var chips = [];
      chips.push('<span class="chip">'+(ehPiloto?'Piloto':'Acompanhante')+'</span>');
      if (ehPiloto && c.utv) chips.push('<span class="chip">UTV '+esc(c.utv)+'</span>');
      if (temUtv){
        chips.push('<span class="chip '+(c.utv_recebido?'ok':'warn')+'">'+(c.utv_recebido?'Recebido ✓':'Recebimento pendente')+'</span>');
        chips.push('<span class="chip '+(c.utv_devolvido?'ok':'warn')+'">'+(c.utv_devolvido?'Devolvido ✓':'Aguardando devolução')+'</span>');
      }
      if (!c.staff){ var cfP = chipFalta(c, OBRIG_PART); if (cfP) chips.push(cfP); }
      h += '<div class="row" data-cli="'+c.id+'" role="button" tabindex="0">' +
        '<div class="info"><div class="nm">'+esc(c.nome)+'</div>' +
        '<div class="sub" style="margin-top:4px">'+chips.join("")+'</div>' +
        '</div></div>';
    });
  });
  $("p_lista").innerHTML = h || '<div class="empty">Nenhum participante com essa busca.</div>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-cli]"), function(r){
    var abrir = function(){ sheetCliente(+r.getAttribute("data-cli")); };
    r.onclick = abrir;
    r.onkeydown = function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); abrir(); } };
  });
}

/* Exportação da tela de Participantes: abre uma janela à parte com um HTML
   próprio pra impressão/PDF (sem depender de biblioteca nenhuma — é o
   diálogo nativo do navegador, "Salvar como PDF"), reaproveitando os mesmos
   números do Resumo e a mesma lista filtrada/agrupada que está na tela
   naquele momento. Paginação e "não cortar no meio" ficam por conta do
   próprio motor de impressão do navegador (regras @page/break-inside abaixo). */
/* ============================================================
   Exportação em PDF (impressão) — usada por Participantes,
   Financeiro, Hospedagem e Simulador. Sem biblioteca nenhuma: abre
   uma janela com um HTML próprio, autocontido, e dispara o
   "Salvar como PDF" nativo do navegador. Cada tela monta seu
   próprio corpo (KPIs + lista/tabela) e chama abrirJanelaImpressao
   com o título e esse corpo — o restante (fonte, cores, cabeçalho,
   rodapé, paginação automática via @page) é compartilhado. */
var ESTILO_IMPRESSAO =
  '@page{ size:A4; margin:16mm 14mm; }'+
  '*{ box-sizing:border-box; }'+
  'body{ font-family:"Archivo",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:#111; margin:0; padding:24px; }'+

  '.dim{ color:#888; font-weight:400; font-size:11px; }'+
  '.chips{ display:flex; flex-wrap:wrap; gap:5px; }'+
  '.chip{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; border:1px solid #ccc; border-radius:99px; padding:2px 9px; color:#444; }'+
  '.chip b{ font-weight:700; }'+
  '.chip.verde{ border-color:#8fcf9f; color:#237a3f; }'+
  '.chip.amarelo{ border-color:#e6cf7a; color:#8a6d10; }'+

  '.pessoa{ padding:7px 0; border-bottom:1px solid #eee; break-inside:avoid; }'+

function kpiHtmlImp(rotulo, valor, extra, cls){
  return '<div class="kpi"><small>'+esc(rotulo)+'</small><b'+(cls?' class="'+cls+'"':'')+'>'+esc(String(valor))+'</b>'+(extra||'')+'</div>';

function abrirJanelaImpressao(subtitulo, filtroTexto, corpoHtml){
  var agora = new Date();
  var dataExp = String(agora.getDate()).padStart(2,'0')+'/'+String(agora.getMonth()+1).padStart(2,'0')+'/'+agora.getFullYear()+' às '+String(agora.getHours()).padStart(2,'0')+':'+String(agora.getMinutes()).padStart(2,'0');
  var nomeEvento = (EV && EV.evento) ? EV.evento.nome : ''; // v4.38: telas globais (ex.: Fornecedores) não têm evento aberto
  var doc =
    '<!doctype html><html><head><meta charset="utf-8">'+
    '<title>'+esc(subtitulo)+(nomeEvento?' — '+esc(nomeEvento):'')+'</title>'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">'+
    '<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">'+

      '<div class="cabecalho">'+
        '<div><div class="marca">Desbravando UTV</div><div class="titulo">'+esc(subtitulo)+(nomeEvento?' · '+esc(nomeEvento):'')+'</div></div>'+
        '<div class="meta-exp">Exportado em '+dataExp+'<br>por '+esc(NOME||'')+'</div>'+
      '</div>'+

      corpoHtml+
      '<div class="rodape"><span>Desbravando UTV — gerado pelo sistema de expedições</span><span>'+dataExp+'</span></div>'+
      '<script>window.onload=function(){ setTimeout(function(){ window.print(); }, 300); };<\/script>'+
    '</body></html>';
  var win = window.open('', '_blank');
  if (!win) return toast("O navegador bloqueou a janela de exportação — permita pop-ups para este site", true);
  win.document.open(); win.document.write(doc); win.document.close();

/* v4.38: escolha entre exportar a página inteira ou só o painel de

function exportarParticipantesPDF(somenteIndicadores){
  var d = calcParticipantesStats(CL);

  var resumoHtml =
    '<div class="grp-title">Pessoas</div>' +
    '<div class="kpis">' +
      kpiHtmlImp('Total', d.total) + kpiHtmlImp('Adultos', d.adultos) + kpiHtmlImp('Crianças', d.criancas) +
      kpiHtmlImp('Staff (equipe)', d.staff, d.custoStaff>0 ? ' <span class="dim">'+esc(brl(d.custoStaff))+' custo</span>' : '') +
      kpiHtmlImp('Com pendências', d.comPend) + kpiHtmlImp('Desistências', d.desistencias) +
    '</div>' +
    '<div class="grp-title">UTVs</div>' +
    '<div class="kpis">' + kpiHtmlImp('Total', d.utv4+d.utv2) + kpiHtmlImp('4 lugares', d.utv4) + kpiHtmlImp('2 lugares', d.utv2) + '</div>' +
    cegonhasHtml(calcCegonhas(CL), true);

  var grupos = agruparClientesFiltrados();
  var listaHtml = '';
  var totalListado = 0;
  Object.keys(grupos).sort().forEach(function(g){
    listaHtml += '<div class="grupo-nome">'+esc(g)+'</div>';
    grupos[g].forEach(function(c){
      totalListado++;

      chips.push('<span class="chip">'+(ehPiloto?'Piloto':'Acompanhante')+'</span>');
      if (ehPiloto && c.utv) chips.push('<span class="chip">UTV '+esc(c.utv)+'</span>');
      if (!c.staff){ var f = pendencias(c, OBRIG_PART); if (f.length) chips.push('<span class="chip vermelho">Pendência</span>'); }
      listaHtml += '<div class="pessoa">' +
        '<div class="pessoa-nome">'+esc(c.nome)+'</div>' +
        '<div class="chips">'+chips.join('')+'</div>' +
      '</div>';
    });
  });
  if (!totalListado) listaHtml = '<p class="dim">Nenhum participante com esse filtro.</p>';

  if (somenteIndicadores) return abrirJanelaImpressao('Participantes', '', resumoHtml);
  var filtroTexto = 'Filtro aplicado: <b>'+esc(descricaoFiltroParticipantes())+'</b> — '+totalListado+' listado(s)';
  var corpo = resumoHtml + '<div class="grp-title" style="margin-top:20px">Lista de participantes</div>' + listaHtml;
  abrirJanelaImpressao('Participantes', filtroTexto, corpo);
}

  api("/api/crm").then(function(j){ CRMLIST = j.contatos||[]; fn(); })

}

        emergencia_nome: $("c_emerg_nome").value.trim(), emergencia_parentesco: $("c_emerg_parentesco").value.trim(),

      // participante comum isso agora mora em Financeiro > Contas a Receber.

      $("c_save").disabled = true;
      var p = novo ? api("/api/eventos/"+EV.evento.id+"/clientes","POST",body)

       .catch(function(e){ $("c_save").disabled=false; toast(e.message,true); });

    var del = $("c_del");

        .catch(function(e){ toast(e.message,true); });

    Array.prototype.forEach.call(document.querySelectorAll("[data-ntdel]"), function(b){
      b.onclick = function(){
        if (!confirm("Remover esta anotação?")) return;
        api("/api/cliente-notas/"+b.getAttribute("data-ntdel"),"DELETE")
          .then(function(){ toast("Anotação removida"); sheetCliente(id); })
          .catch(function(e){ toast(e.message,true); });

    Array.prototype.forEach.call(document.querySelectorAll("[data-pgdel]"), function(b){
      b.onclick = function(){
        if (!confirm("Remover este pagamento?")) return;
        api("/api/pagamentos/"+b.getAttribute("data-pgdel"),"DELETE")
          .then(function(){ toast("Pagamento removido"); sheetCliente(id); carregarClientesSilencioso(); })
          .catch(function(e){ toast(e.message,true); });
      };
    });
    var run = $("ru_novo");
    if (run) run.onclick = function(){ sheetRegistroUtv(id); };
    Array.prototype.forEach.call(document.querySelectorAll("[data-ru-edit]"), function(b){
      b.onclick = function(){
        var rid = +b.getAttribute("data-ru-edit");
        var reg = registrosUtv.find(function(x){ return x.id===rid; });

    });
    // v4.47: busca as fotos de cada registro assim que a ficha abre — sem
    // precisar clicar em nada pra ver a galeria.
    registrosUtv.forEach(function(reg){ carregarFotosRegistro(reg.id); });

    };
    var irFin = $("c_ir_fin");
    if (irFin) irFin.onclick = function(){
      CUSUB = "receber"; FIN_Q = c.nome; FIN_STATUS = "";
      fecharSheet();

  comContatos(function(){

                      contrato_enviado:0,contrato_assinado:0,pacote:null,forma_pagamento:"",staff:0,desistente:0,observacoes:"",contato_id:null,cegonha:null,
                      endereco:"",nacionalidade:"",estado_civil:"",rg:"",email:"",
                      emergencia_nome:"",emergencia_parentesco:"",emergencia_telefone:""}, [], []);
    else api("/api/clientes/"+id).then(function(j){ render(j.cliente, j.pagamentos||[], j.notas||[], j.registros_utv||[]); })
          .catch(function(e){ toast(e.message,true); });

/* Registro de Envio do UTV — pensado pra ser rápido no celular:
   1) lista compacta de registros já feitos (sem carregar fotos de cara,
      só um botão "Fotos" que abre sob demanda);
   2) "+ Novo registro" abre UMA tela só com condição + observações + fotos,
      tudo enviado junto num só toque (antes eram dois passos — criar o
      texto, esperar recarregar, só depois aparecia onde anexar foto — mais
      lento e mais chance de dar zebra no celular). */
/* v4.47: bloco de consulta rápida — fotos (galeria horizontal) e observações
   visíveis direto, sem precisar abrir nada. Edição/exclusão ficam atrás de
   um único botão "Editar registro", pra não competir com a consulta. */
function registroUtvResumoHtml(reg){
  return '<div style="border-bottom:1px solid #1d1d1d;padding:10px 0">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:700;font-size:13.5px">'+esc(reg.condicao_geral)+'</div>'+
        '<div style="font-size:11px;color:var(--dim);margin-top:2px">'+(reg.criado_por?esc(reg.criado_por)+' · ':'')+fmtData(reg.criado_em)+'</div>'+
      '</div>'+
      '<button class="btn2" data-ru-edit="'+reg.id+'" style="padding:6px 12px;font-size:12px;white-space:nowrap">Editar registro</button>'+
    '</div>'+
    '<div id="ru_fotos_'+reg.id+'" style="margin-top:8px"><div class="meta">Carregando fotos…</div></div>'+
    (reg.observacoes ?
      '<div style="margin-top:8px">'+
        '<div style="font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)">Observações</div>'+
        '<div style="font-size:13px;color:var(--mut);white-space:pre-wrap;margin-top:2px">'+esc(reg.observacoes)+'</div>'+
      '</div>' : '')+
  '</div>';
}
/* Galeria horizontal (miniaturas) de um registro — desliza por toque ou pelos
   botões ‹ ›, com contador. Busca as fotos em paralelo assim que o bloco do
   participante abre, sem precisar de clique nenhum pra ver. */
function carregarFotosRegistro(regId){
  api("/api/anexos?parent_tipo=registro_utv&parent_id="+regId).then(function(j){
    var host = $("ru_fotos_"+regId); if (!host) return;
    var fotos = j.anexos || [];
    if (!fotos.length){ host.innerHTML = '<div class="meta">Nenhuma foto anexada ainda.</div>'; return; }
    host.innerHTML = '<div class="ru-gal" id="ru_gal_'+regId+'"><div class="meta">Carregando…</div></div>'+
      (fotos.length>1 ?
        '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">'+
          '<button type="button" class="btn2" data-ru-prev="'+regId+'" style="padding:3px 12px;font-size:13px">‹</button>'+

function ligarScrollGaleria(regId, total){
  var gal = $("ru_gal_"+regId); if (!gal) return;
  var cnt = $("ru_cnt_"+regId);
  function passo(){ var imgs = gal.querySelectorAll(".ru-gal-img"); return imgs.length ? imgs[0].offsetWidth+8 : 0; }
  function atualizarContador(){
    if (!cnt) return;
    var p = passo(); if (!p) return;
    var idx = Math.max(0, Math.min(total-1, Math.round(gal.scrollLeft/p)));
    cnt.textContent = "Foto "+(idx+1)+" / "+total;
  }
  gal.addEventListener("scroll", debounce(atualizarContador, 80));
  var prev = document.querySelector('[data-ru-prev="'+regId+'"]');
  var next = document.querySelector('[data-ru-next="'+regId+'"]');
  if (prev) prev.onclick = function(){ gal.scrollBy({left:-passo(), behavior:"smooth"}); };
  if (next) next.onclick = function(){ gal.scrollBy({left:passo(), behavior:"smooth"}); };
}

/* ============================================================
   SIMULADOR DE CUSTOS (admin)
   ============================================================ */
var MULT_TXT = { nenhum:"—", diarias:"× diárias", dias_trilha:"× dias de trilha", refeicoes:"× refeições", eventos:"× eventos" };

function calcCenario(c, linhas){
  var mult = { nenhum:1, diarias:c.diarias, dias_trilha:c.dias_trilha, refeicoes:c.refeicoes, eventos:c.eventos_qtd };
  var pp = 0, fixo = 0;
  linhas.forEach(function(l){
    var m = mult[l.mult] || 1;
    if (l.tipo === "fixo") fixo += l.preco * m;
    else pp += l.media * l.preco * m;
  });
  var pessoas = c.pessoas || 1;
  return { pp: pp + fixo/pessoas, total: pp*pessoas + fixo, fixo: fixo };
}
/* Consolida as linhas de um cenário por centro de custo — base do painel
   "Composição dos Custos da Expedição". */
/* Linha por linha, quanto cada uma contribui pro total e pro por-pessoa. */
function contribuicaoLinha(c, l){
  var mult = { nenhum:1, diarias:c.diarias, dias_trilha:c.dias_trilha, refeicoes:c.refeicoes, eventos:c.eventos_qtd };
  var pessoas = c.pessoas || 1;
  var m = mult[l.mult] || 1;
  if (l.tipo === "fixo"){ var total = l.preco*m; return { total:total, pp: total/pessoas }; }
  var pp = l.media*l.preco*m;
  return { total: pp*pessoas, pp: pp };
}
/* Consolida as linhas por centro de custo — ordenado do maior pro menor
   impacto financeiro (é o que o painel "Composição" quer mostrar de cara). */
function composicaoCustos(c, linhas){
  var porCat = {};
  linhas.forEach(function(l){
    var ct = contribuicaoLinha(c, l);
    var cid = l.categoria_id || 0;
    if (!porCat[cid]) porCat[cid] = { categoria_id: l.categoria_id||null, categoria: nomeCentroCusto(l.categoria_id), total:0, pp:0 };
    porCat[cid].total += ct.total;
    porCat[cid].pp += ct.pp;
  });
  return Object.keys(porCat).map(function(k){ return porCat[k]; }).sort(function(a,b){ return b.total-a.total; });
}
/* Idem, mas ordenado pela ordem cadastrada dos centros de custo (não por
   tamanho) — é o usado pra agrupar visualmente a lista editável de linhas. */
function agruparLinhasPorCentro(linhas){
  var porCat = {};
  linhas.forEach(function(l){
    var cid = l.categoria_id || 0;
    (porCat[cid] = porCat[cid] || []).push(l);
  });
  var grupos = [];
  CENTROS_CUSTO.forEach(function(cc){
    if (porCat[cc.id]) grupos.push({ categoria_id: cc.id, nome: cc.nome, linhas: porCat[cc.id] });
  });
  if (porCat[0]) grupos.push({ categoria_id: null, nome: "Sem centro de custo", linhas: porCat[0] });
  return grupos;
}

function composicaoHtml(comp, total){

/* v4.35: depois de editar item/média/preço (texto, digitado), atualiza só
   os números que dependem do valor — KPIs do topo, Composição dos Custos e
   a coluna "Por pessoa" de cada linha — sem recriar a tela inteira. Os
   campos de input continuam os mesmos elementos, sem perder o foco durante
   uma edição em sequência. Tipo/Multiplicador/Centro de custo (seletores)
   continuam recarregando a tela toda, porque podem reorganizar as linhas
   em outro grupo — como são cliques (não digitação), não há foco a perder. */
function atualizarCalculosCenario(c, linhas){
  var r = calcCenario(c, linhas);
  var kp = $("s_kpi_pp"); if (kp) kp.textContent = brl(r.pp);
  var kt = $("s_kpi_total"); if (kt) kt.textContent = brl(r.total);
  var cw = $("s_comp_wrap"); if (cw) cw.innerHTML = composicaoHtml(composicaoCustos(c, linhas), r.total);
  linhas.forEach(function(l){
    var cell = document.querySelector('[data-pp="'+l.id+'"]');
    if (cell) cell.textContent = brl(contribuicaoLinha(c, l).pp);
  });
}

/* ============================================================
   v4.46 · Lista de Compras — consolidação das linhas de custo dos
   centros de custo selecionados. O Simulador continua sendo a única
   origem dos dados: nada aqui é salvo, é calculado na hora a partir
   de SIM.linhas. Linhas "fixo total" não têm quantidade unitária
   (são um valor rateado, não um item a comprar) e ficam de fora.
   ============================================================ */
function fmtQtd(n){
  var r = Math.round(n*10)/10;
  return (Math.round(r)===r ? String(Math.round(r)) : String(r).replace(".", ","));
}
function calcularListaCompras(c, linhas, centroIds){
  var mult = { nenhum:1, diarias:c.diarias, dias_trilha:c.dias_trilha, refeicoes:c.refeicoes, eventos:c.eventos_qtd };
  var pessoas = c.pessoas || 1;
  var porItem = {}, ordem = [], ignorados = 0;
  linhas.forEach(function(l){
    if (centroIds.indexOf(l.categoria_id) === -1) return;
    if (l.tipo === "fixo"){ ignorados++; return; }
    var nome = String(l.item||"").trim();
    if (!nome) return;
    var m = mult[l.mult] || 1;
    var qtd = (Number(l.media)||0) * m * pessoas;
    if (!porItem[nome]){ porItem[nome] = { item:nome, qtd:0 }; ordem.push(nome); }
    porItem[nome].qtd += qtd;
  });
  var itens = ordem.map(function(k){ return porItem[k]; }).sort(function(a,b){ return b.qtd-a.qtd; });
  return { itens: itens, ignorados: ignorados };
}

function renderCenario(cid){
  var c = SIM.cenarios.find(function(x){ return x.id===cid; });
  if (!c) return renderSimulador();
  var linhas = SIM.linhas.filter(function(l){ return l.cenario_id===cid; });
  var r = calcCenario(c, linhas);
  // v4.36: salvamento em segundo plano (edição sem recarregar a tela) pode
  // ainda estar em andamento quando outra ação recarrega tudo do servidor
  // (mudar um seletor, adicionar/remover linha etc.) — sem esperar, o
  // recarregamento pode buscar um dado mais velho que o que já está na tela
  // e "desfazer" visualmente a última edição. Toda ação que recarrega
  // espera esse salvamento terminar antes de buscar os dados de novo.
  var pendingSalvamento = null;

  var params = [["pessoas","Pessoas"],["diarias","Diárias"],["dias_trilha","Dias de trilha"],["refeicoes","Refeições"],["eventos_qtd","Eventos"]];
  var h = '<button class="backln" id="s_volta">← Cenários</button>' +
    '<h2 class="anton" style="font-size:24px;margin:2px 0 12px">'+esc(c.nome)+(c.modelo?' <span class="chip ok" style="vertical-align:middle">★ modelo</span>':'')+'</h2>' +
    '<div class="kpis">' +
      '<div class="kpi"><small>Por pessoa</small><b id="s_kpi_pp">'+brl(r.pp)+'</b></div>' +
      '<div class="kpi"><small>Total previsto</small><b id="s_kpi_total">'+brl(r.total)+'</b></div>' +
    '</div>' +
    '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(95px,1fr))">' +
    params.map(function(p){
      return '<div class="kpi"><small>'+p[1]+'</small><input class="mini" data-param="'+p[0]+'" inputmode="numeric" value="'+c[p[0]]+'" style="margin-top:2px"></div>';
    }).join("") + '</div>';

  var comp = composicaoCustos(c, linhas);
  h += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:22px">' +
      '<h3 class="anton" style="font-size:15px;color:var(--mut);margin:0">Composição dos Custos da Expedição</h3>' +
      '<button class="link" id="s_centros">Gerenciar centros de custo →</button>' +
    '</div>' +
    '<p class="meta" style="margin:0 0 8px">Como o total previsto se distribui entre os centros de custo — dá pra ver de cara onde está o peso do orçamento.</p>' +
    '<div id="s_comp_wrap">'+composicaoHtml(comp, r.total)+'</div>';

  var centroOpts = function(selecionado){
    return '<option value=""'+(!selecionado?' selected':'')+'>—</option>' +
      CENTROS_CUSTO.map(function(cc){ return '<option value="'+cc.id+'"'+(selecionado===cc.id?' selected':'')+'>'+esc(cc.nome)+'</option>'; }).join("");
  };
  var linhaTr = function(l){
    var pp = contribuicaoLinha(c, l).pp;
    return '<tr>' +
      '<td><input class="mini" data-lin="'+l.id+'" data-campo="item" value="'+esc(l.item)+'" style="min-width:110px"></td>' +
      '<td><select class="mini" data-lin="'+l.id+'" data-campo="tipo"><option value="pessoa"'+(l.tipo!=="fixo"?" selected":"")+'>por pessoa</option><option value="fixo"'+(l.tipo==="fixo"?" selected":"")+'>fixo total</option></select></td>' +
      '<td><input class="mini" data-lin="'+l.id+'" data-campo="media" inputmode="decimal" value="'+l.media+'" style="width:56px"'+(l.tipo==="fixo"?' disabled':'')+'></td>' +
      '<td><input class="mini" data-lin="'+l.id+'" data-campo="preco" inputmode="decimal" value="'+String(l.preco).replace(".",",")+'" style="width:78px"></td>' +
      '<td><select class="mini" data-lin="'+l.id+'" data-campo="mult">' +
        Object.keys(MULT_TXT).map(function(k){ return '<option value="'+k+'"'+(l.mult===k?" selected":"")+'>'+MULT_TXT[k]+'</option>'; }).join("") +
      '</select></td>' +
      '<td><select class="mini" data-lin="'+l.id+'" data-campo="categoria_id" title="Mover para outro centro de custo" style="width:110px">'+centroOpts(l.categoria_id||null)+'</select></td>' +
      '<td class="num" data-pp="'+l.id+'">'+brl(pp)+'</td>' +
      '<td><button class="delx" data-lindel="'+l.id+'" title="Remover linha">×</button></td></tr>';
  };
  h += '<h3 class="anton" style="font-size:15px;color:var(--mut);margin:22px 0 4px">Linhas de custo</h3>';
  var gruposLinhas = agruparLinhasPorCentro(linhas);
  if (!gruposLinhas.length) h += '<div class="empty">Nenhuma linha ainda. Adicione a primeira abaixo.</div>';
  gruposLinhas.forEach(function(grupo){
    h += '<h4 class="anton" style="font-size:13px;color:var(--dim);margin:14px 0 6px">'+esc(grupo.nome)+'</h4>' +

      grupo.linhas.map(linhaTr).join("") +

  });
  h += '<button class="addrow" id="s_addlin">+ Adicionar linha de custo</button>' +

      '<button class="btn2" id="s_exp_pdf">Exportar PDF</button>' +
      '<button class="btn-danger" id="s_del">Excluir cenário</button>' +
    '</div>';
  $("main").innerHTML = h;

  $("s_volta").onclick = renderSimulador;
  // recalcula na hora do clique — depois de editar campos sem recarregar a
  // tela (ver atualizarCalculosCenario), o "r" de cima do render fica velho.
  $("s_exp_pdf").onclick = function(){
    var r = calcCenario(c, linhas);
    escolherExportacaoPDF('Simulador · '+c.nome,
      function(){ exportarCenarioPDF(c, linhas, r); },
      function(){ exportarCenarioPDF(c, linhas, r, true); });
  };
  $("s_centros").onclick = function(){ VOLTA_CENTROS_CUSTO = true; location.hash = "#/centros-de-custo"; };
  $("s_lista_compras").onclick = function(){ sheetListaCompras(c, linhas); };
  $("s_modelo").onclick = function(){
    Promise.resolve(pendingSalvamento).then(function(){
      return api("/api/cenarios/"+cid,"PATCH",{modelo: c.modelo?0:1});
    }).then(function(){ toast(c.modelo?"Removido dos modelos":"Salvo como modelo"); carregarSimulador(cid); })
      .catch(function(e){ toast(e.message,true); });
  };
  // v4.35/v4.36: campos digitados (parâmetros do topo, item/média/preço)
  // atualizam os cálculos na hora, sem recriar a tela — evita perder o foco
  // ao editar várias linhas em sequência. Salva no servidor do mesmo jeito
  // de sempre (guardado em pendingSalvamento); se falhar, desfaz o valor
  // local e recalcula de novo.
  Array.prototype.forEach.call(document.querySelectorAll("[data-param]"), function(inp){
    inp.onchange = function(){
      var campo = inp.getAttribute("data-param");
      var antigo = c[campo], novo = parseInt(inp.value,10)||0;
      c[campo] = novo;
      atualizarCalculosCenario(c, linhas);
      var b = {}; b[campo] = novo;
      pendingSalvamento = api("/api/cenarios/"+cid,"PATCH",b)
        .catch(function(e){ c[campo] = antigo; atualizarCalculosCenario(c, linhas); toast(e.message,true); });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-lin]"), function(inp){
    inp.onchange = function(){
      var campo = inp.getAttribute("data-campo"), lid = +inp.getAttribute("data-lin"), b = {};
      if (campo==="media"||campo==="preco") b[campo] = parseMoeda(inp.value) ?? 0;
      else if (campo==="categoria_id") b[campo] = inp.value ? +inp.value : null;
      else b[campo] = inp.value;
      // tipo/mult/categoria_id são seletores (clique, não digitação) e podem
      // reorganizar as linhas em outro grupo — seguem recarregando a tela
      // toda, só esperando qualquer edição de texto ainda em andamento.
      if (campo==="tipo" || campo==="mult" || campo==="categoria_id"){
        pendingSalvamento = Promise.resolve(pendingSalvamento).then(function(){
          return api("/api/linhas/"+lid,"PATCH",b);
        }).then(function(){ carregarSimulador(cid); })
          .catch(function(e){ toast(e.message,true); });
        return;
      }
      var l = linhas.find(function(x){ return x.id===lid; });
      var antigo = l ? l[campo] : undefined;
      if (l) l[campo] = b[campo];
      atualizarCalculosCenario(c, linhas);
      pendingSalvamento = api("/api/linhas/"+lid,"PATCH",b)
        .catch(function(e){ if (l) l[campo] = antigo; atualizarCalculosCenario(c, linhas); toast(e.message,true); });
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-lindel]"), function(b){
    b.onclick = function(){
      var lid = b.getAttribute("data-lindel");
      Promise.resolve(pendingSalvamento).then(function(){
        return api("/api/linhas/"+lid,"DELETE");
      }).then(function(){ carregarSimulador(cid); }).catch(function(e){ toast(e.message,true); });
    };
  });
  $("s_addlin").onclick = function(){
    Promise.resolve(pendingSalvamento).then(function(){
      return api("/api/cenarios/"+cid+"/linhas","POST",{item:"Novo item",tipo:"pessoa",media:1,preco:0,mult:"nenhum"});
    }).then(function(){ carregarSimulador(cid); }).catch(function(e){ toast(e.message,true); });
  };
  $("s_del").onclick = function(){
    if (!confirm('Excluir o cenário "'+c.nome+'"?')) return;
    Promise.resolve(pendingSalvamento).then(function(){ return api("/api/cenarios/"+cid,"DELETE"); })
      .then(function(){ toast("Cenário excluído"); carregarSimulador(); })
      .catch(function(e){ toast(e.message,true); });
  };
}

function exportarHospedagemPDF(somenteIndicadores){
  var camas=0, ocup=0, receita=0;
  HO.quartos.forEach(function(q){
    camas += q.capacidade;
    var oc = HO.alocacoes.filter(function(a){ return a.quarto_id===q.id; }).length;
    ocup += oc;

/* ============================================================

var TA = [];
var TFILT = { q:"", status:"", prio:"", resp:"", setor:"" };
var FOCOS = [];

/* ============================================================
   v4.6 · SISTEMA OPERACIONAL — Ciclo Operacional (op_*)
   Etapa → Categoria → Tópico → Tarefas (checklist simples, sem fase fixa).
   A árvore é renderizada como acordeão; mutações refazem a busca
   preservando o estado aberto/fechado (OPEN_ET / OPEN_IT).
   ============================================================ */
// v4.5: etapas e categorias são dinâmicas (vêm da API), não mais uma lista fixa.
var OP_ETAPAS = [];
var OP_CATEGORIAS = [];
var PAINEL_OP_ABERTO = true;
var FILTROS_OP = { responsavel:"", status:"", categoria_id:"", data:"" };

/* Etapas desativadas continuam com tópicos/tarefas no banco (só ficam ocultas
   das telas), então qualquer contagem/indicador precisa filtrar por isso —
   senão soma dado de etapa que nem aparece mais. */
function etapaAtivaId(etapaId){
  var et = OP_ETAPAS.find(function(e){ return e.id===etapaId; });
  return !!(et && et.ativo);
}

function carregarOperacao(){
  $("main").innerHTML = '<p style="color:var(--dim)">Carregando…</p>';
  Promise.all([
    api("/api/eventos/"+EV.evento.id+"/op"),
    api("/api/etapas"),
    api("/api/categorias")
  ]).then(function(rs){
    OP = rs[0].itens || []; OP_ETAPAS = rs[1].etapas || []; OP_CATEGORIAS = rs[2].categorias || [];
    renderOperacao();
  }).catch(function(e){ $("main").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
}
function recarregarOperacao(){

function findItem(id){ for (var a=0;a<OP.length;a++) if (OP[a].id===id) return OP[a]; return null; }
function findTarefaOp(id){ for (var a=0;a<OP.length;a++){ var ts=OP[a].tarefas||[]; for(var b=0;b<ts.length;b++) if(ts[b].id===id) return {item:OP[a],tarefa:ts[b]}; } return null; }
function findSubOp(id){ for (var a=0;a<OP.length;a++){ var ts=OP[a].tarefas||[]; for(var b=0;b<ts.length;b++){ var ss=ts[b].subtarefas||[]; for(var c=0;c<ss.length;c++) if(ss[c].id===id) return ss[c]; } } return null; }
/* v4.35: alterna a conclusão de uma subtarefa do Planejamento Operacional (otimista) */
function toggleSubtarefaOp(sid){

  var antes = sub.concluido;
  sub.concluido = antes ? 0 : 1; renderOperacao();

/* Data de hoje (+offset dias) no formato ISO (YYYY-MM-DD), pra comparar com o
   <input type="date"> da tarefa. */
function isoHoje(offsetDias){
  var d = new Date(); d.setDate(d.getDate() + (offsetDias||0));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* "2026-08-26" -> "26/08/2026". Se não estiver no formato ISO (dado antigo em texto livre), devolve como veio. */
function fmtDataBR(iso){
  if (!iso) return "";
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3]+"/"+m[2]+"/"+m[1]) : iso;
}
/* Período da expedição: (ini, fim) -> "26/08 a 30/08 de 2026" (mesmo ano),
   "26/12/2026 a 03/01/2027" (anos diferentes), ou só a data de início se
   não houver fim (ou fim igual ao início). */
function fmtPeriodoBR(iniIso, fimIso){
  if (!iniIso) return "";
  var ini = fmtDataBR(iniIso);
  if (!fimIso || fimIso === iniIso) return ini;
  var fim = fmtDataBR(fimIso);
  var mi = String(iniIso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  var mf = String(fimIso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!mi || !mf) return ini + ' a ' + fim;
  if (mi[1] === mf[1]) return mi[3]+'/'+mi[2]+' a '+mf[3]+'/'+mf[2]+' de '+mi[1];
  return ini + ' a ' + fim;
}

/* Painel-resumo do Planejamento Operacional: junta todas as tarefas de todos
   os tópicos (de todas as etapas, exceto Operação em Campo) e calcula os
   indicadores. Reaproveita .kpis/.kpi (já responsivo em grid). */
function calcIndicadoresPlanejamento(){
  var tarefas = [];
  OP.forEach(function(i){ if (!etapaAtivaId(i.etapa_id)) return; (i.tarefas||[]).forEach(function(t){ tarefas.push({ t:t, item:i }); }); });
  var total = tarefas.length;
  var pend = tarefas.filter(function(x){ return x.t.status==="afazer"; }).length;
  var conc = tarefas.filter(function(x){ return x.t.status==="concluido"; }).length;

  var hoje = isoHoje(0), amanha = isoHoje(1);
  var vencidas=0, venceHoje=0, venceAmanha=0, aVencer=0;
  tarefas.forEach(function(x){
    if (!x.t.data_limite || x.t.status==="concluido") return;
    if (x.t.data_limite < hoje) vencidas++;
    else if (x.t.data_limite === hoje) venceHoje++;
    else if (x.t.data_limite === amanha) venceAmanha++;
    else aVencer++;
  });

  var porEt = {};
  OP_ETAPAS.forEach(function(e){
    if (e.ativo && !e.redireciona_campo) porEt[e.id] = { nome: e.nome, etId: e.id, ordem: e.ordem||0, total:0, conc:0 };
  });
  tarefas.forEach(function(x){
    var eid = x.item.etapa_id;
    if (!porEt[eid]) return;
    porEt[eid].total++;
    if (x.t.status==="concluido") porEt[eid].conc++;
  });
  var etapasPainel = Object.keys(porEt).map(function(k){ return porEt[k]; }).sort(function(a,b){ return a.ordem-b.ordem; });

  var proximas = tarefas.filter(function(x){ return x.t.data_limite && x.t.status!=="concluido"; })
    .sort(function(a,b){ return a.t.data_limite < b.t.data_limite ? -1 : (a.t.data_limite > b.t.data_limite ? 1 : 0); })
    .slice(0, 8);

  return { total:total, pend:pend, conc:conc, vencidas:vencidas, venceHoje:venceHoje, venceAmanha:venceAmanha, aVencer:aVencer, etapasPainel:etapasPainel, proximas:proximas, hoje:hoje };
}

        proximas.map(function(x){

          var atraso = x.t.data_limite < hoje;

              '<span style="color:'+(atraso?'var(--p1)':'inherit')+'">'+esc(fmtDataBR(x.t.data_limite))+'</span>'+
              '<span>'+STATUS_TXT[x.t.status]+'</span>'+
            '</div></button>';
        }).join('') + '</div>'
        : '<div class="empty" style="margin:6px 0">Nenhuma tarefa com prazo definido.</div>');
  }
  return html + '</div>';
}

/* Lista (não-nested) de todos os responsáveis já usados em tópicos/tarefas, pro autocomplete do filtro. */
function responsaveisOp(){
  var s = {};
  OP.forEach(function(i){
    if (!etapaAtivaId(i.etapa_id)) return;
    if (i.responsavel) s[i.responsavel] = 1;
    (i.tarefas||[]).forEach(function(t){ if (t.responsavel) s[t.responsavel] = 1; });
  });
  return Object.keys(s).sort();
}
function filtroOpAtivo(){
  return !!(FILTROS_OP.responsavel || FILTROS_OP.status || FILTROS_OP.categoria_id || FILTROS_OP.data);
}
function tarefasFiltradasOp(){
  var hoje = isoHoje(0), amanha = isoHoje(1);
  var resp = FILTROS_OP.responsavel.toLowerCase();
  var out = [];
  OP.forEach(function(i){
    if (!etapaAtivaId(i.etapa_id)) return;
    (i.tarefas||[]).forEach(function(t){
      if (resp && (t.responsavel||"").toLowerCase().indexOf(resp) < 0) return;
      if (FILTROS_OP.status && t.status !== FILTROS_OP.status) return;
      if (FILTROS_OP.categoria_id && i.categoria_id !== +FILTROS_OP.categoria_id) return;
      if (FILTROS_OP.data){
        if (!t.data_limite) return;
        if (FILTROS_OP.data === "vencidas" && !(t.data_limite < hoje && t.status !== "concluido")) return;
        if (FILTROS_OP.data === "hoje" && t.data_limite !== hoje) return;
        if (FILTROS_OP.data === "amanha" && t.data_limite !== amanha) return;
        if (FILTROS_OP.data === "proximos" && !(t.data_limite > amanha)) return;
      }
      out.push({ t:t, item:i });
    });
  });
  out.sort(function(a,b){
    var da = a.t.data_limite || "9999-99-99", db = b.t.data_limite || "9999-99-99";
    return da < db ? -1 : (da > db ? 1 : 0);
  });
  return out;
}

      '</select>'+
      '<select id="fop_cat" style="flex:1;min-width:150px"><option value="">Categoria (todas)</option>'+opcoesCat+'</select>'+
      '<select id="fop_data" style="flex:1;min-width:140px">'+

  $("fop_data").onchange = function(){ FILTROS_OP.data = this.value; renderOperacao(); };
  var lim = $("fop_limpar"); if (lim) lim.onclick = function(){ FILTROS_OP = { responsavel:"", status:"", categoria_id:"", data:"" }; renderOperacao(); };

/* Agrupa os tópicos de uma etapa por categoria (na ordem cadastrada em Categorias),
   em acordeões próprios — fechados por padrão, mostrando só os tópicos da
   categoria quando expandida (navegação Etapa → Categoria → Tópico → Tarefas). */
function agruparTopicosPorCategoriaHtml(itens, etapaId){
  var porCat = {}, semCat = [];
  itens.forEach(function(i){
    if (i.categoria_id) (porCat[i.categoria_id] = porCat[i.categoria_id] || []).push(i);
    else semCat.push(i);
  });
  function grupoHtml(chave, nome, lista, catId){
    lista.sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); });
    var ct = etapaId+':'+chave;
    // v4.34: excluir a categoria só desta expedição — o modelo global (e as
    // demais expedições) não são afetados. Não existe pra "Sem categoria".
    var delCatBtn = catId!=null
      ? '<button class="mdel" data-act="cat-del" data-catid="'+catId+'" title="Excluir esta categoria só desta expedição" style="margin-left:2px">×</button>'
      : '';
    // v4.21: tópico é opcional. Quando a categoria tem um único tópico e o nome
    // dele é igual ao da categoria, é um tópico "implícito" (existe só porque
    // toda tarefa precisa de um por baixo, mas não representa uma subdivisão
    // real) — a categoria mostra as tarefas direto, sem uma linha de tópico
    // redundante. Basta dar outro nome ao tópico (ou criar um segundo) que ele
    // volta a aparecer separado — é só uma questão de exibição, o dado por
    // baixo continua sendo Etapa → Categoria → Tópico → Tarefa sempre.
    // v4.27: em Contratações (4) e Confirmações Pré-Expedição (8), categoria
    // com um único tópico sempre acha implícito (mesmo com nome diferente da
    // categoria) — nessas duas etapas cada categoria só existe pra abrigar um
    // único bloco de tarefas, então o nome do tópico nunca acrescenta nada.
    var flattenSempre = (etapaId === 4 || etapaId === 8);
    if (lista.length === 1 && (flattenSempre || lista[0].nome.trim().toLowerCase() === nome.trim().toLowerCase())){
      var item = lista[0];
      var tarefas = item.tarefas || [];
      var feitas = tarefas.filter(function(t){ return t.status==="concluido"; }).length;
      var check = item.status==="concluido" ? "✓" : "";
      var metaLine = [item.responsavel?esc(item.responsavel):null, item.data_limite?'prazo '+esc(fmtDataBR(item.data_limite)):null].filter(Boolean).join(' · ');
      return '<details class="catgroup st-'+item.status+'" data-ct="'+ct+'"'+(OPEN_CT[ct]?' open':'')+'>'+
        '<summary><span class="caret">▶</span>'+
          '<span class="stbtn" title="'+STATUS_TXT[item.status]+' — automático, conforme as tarefas" style="margin-right:2px">'+check+'</span>'+
          '<span class="cname">'+esc(nome)+'</span>'+
          (tarefas.length ? '<span class="ecount">'+feitas+'/'+tarefas.length+'</span>' : '')+
          '<button class="ipgear" data-act="item-edit" data-id="'+item.id+'" title="Editar" style="margin-left:4px">⚙</button>'+
          delCatBtn+
        '</summary>'+
        '<div class="catbody">'+
          (metaLine ? '<div class="meta" style="margin:2px 0 8px">'+metaLine+'</div>' : '')+
          (tarefas.length ? tarefas.map(tarefaOpHtml).join('') : '<p style="color:var(--dim);font-size:13px;margin:4px 0">Nenhuma tarefa ainda.</p>')+
          '<button class="microadd" data-act="tar-add" data-item="'+item.id+'" style="padding:8px;margin-top:8px">+ Tarefa</button>'+
        '</div></details>';
    }
    // Categoria com tópicos reais e distintos (ex.: Logística → Cegonha/Transfer)
    // — mesmo cabeçalho visual da categoria sem tópico (bolinha de status +
    // contagem feito/total), só que abrindo mostra os tópicos de dentro em vez
    // de tarefas direto. Puramente visual: sem bolinha clicável (é um resumo,
    // igual a bolinha de um tópico só) e sem engrenagem (não há um único item
    // pra editar aqui).
    var totT=0, doneT=0;
    lista.forEach(function(i){ (i.tarefas||[]).forEach(function(t){ totT++; if(t.status==="concluido") doneT++; }); });
    var stCat = totT>0 && doneT===totT ? "concluido" : "afazer";
    var checkCat = stCat==="concluido" ? "✓" : "";
    return '<details class="catgroup st-'+stCat+'" data-ct="'+ct+'"'+(OPEN_CT[ct]?' open':'')+'>'+
      '<summary><span class="caret">▶</span>'+
        '<span class="stbtn" title="'+lista.length+' tópicos — '+STATUS_TXT[stCat]+'" style="margin-right:2px">'+checkCat+'</span>'+
        '<span class="cname">'+esc(nome)+'</span>'+
        (totT ? '<span class="ecount">'+doneT+'/'+totT+'</span>' : '')+
        delCatBtn+
      '</summary>'+
      '<div class="catbody"><div class="oplist" data-etlist="'+etapaId+'">'+lista.map(itemHtml).join('')+'</div></div>'+
    '</details>';
  }
  var html = '';
  OP_CATEGORIAS.forEach(function(c){
    var lista = porCat[c.id];
    if (lista && lista.length){ html += grupoHtml('c'+c.id, c.nome, lista, c.id); delete porCat[c.id]; }
  });
  // sobras: categoria que não veio na lista de categorias (ex.: desativada), por segurança
  Object.keys(porCat).forEach(function(cid){
    if (porCat[cid].length) html += grupoHtml('c'+cid, categoriaNome(+cid), porCat[cid], +cid);
  });
  if (semCat.length) html += grupoHtml('sem', "Sem categoria", semCat, null);
  return html;
}

function renderOperacao(){
  snapOpen();
  var ativas = OP_ETAPAS.filter(function(et){ return et.ativo; });
  if (!ativas.length){
    $("main").innerHTML = '<div class="empty">Nenhuma etapa cadastrada ainda. '+
      (PAPEL==="admin" ? 'Crie em <a href="#/etapas">Etapas</a>.' : 'Peça pro admin cadastrar em Etapas.') + '</div>';
    return;
  }
  var html = painelPlanejamentoHtml() + filtrosOpHtml();

  if (filtroOpAtivo()){
    var res = tarefasFiltradasOp();
    html += '<div class="dayblock">'+
      '<label class="top" style="margin-top:0">'+res.length+' tarefa'+(res.length===1?'':'s')+' encontrada'+(res.length===1?'':'s')+'</label>'+
      (res.length
        ? '<div style="margin-top:8px">'+res.map(linhaTarefaFiltradaHtml).join('')+'</div>'
        : '<div class="empty" style="margin-top:8px">Nenhuma tarefa bate com esses filtros.</div>')+
    '</div>';
    $("main").innerHTML = html;
    ligarFiltrosOp();
    $("main").onclick = onOpClick;
    return;
  }

  html += '<p style="color:var(--mut);font-size:13px;margin:2px 0 14px">Cada tópico tem um checklist simples de tarefas — marque conforme for concluindo.</p>';
  ativas.forEach(function(et){
    if (et.redireciona_campo){
      html += '<details class="etapa" data-et="'+et.id+'"'+(OPEN_ET[et.id]?' open':'')+'>'+
        '<summary><span class="caret">▶</span><span class="ename">'+esc(et.nome)+'</span></summary>'+
        '<div class="etapabody"><p style="color:var(--dim);font-size:13px;margin:6px 0 10px">Esta etapa é cronológica, por dias — não usa tópicos.</p>'+
        '<button class="btn2" data-act="go-campo" style="width:100%">Abrir Operação em Campo →</button></div></details>';
      return;
    }
    var itens = OP.filter(function(i){ return i.etapa_id === et.id; });
    var totT=0, doneT=0, catsSet={};
    itens.forEach(function(i){
      if (i.categoria_id) catsSet[i.categoria_id] = 1;
      (i.tarefas||[]).forEach(function(t){ totT++; if(t.status==="concluido") doneT++; });
    });
    var nCats = Object.keys(catsSet).length;
    html += '<details class="etapa" data-et="'+et.id+'"'+(OPEN_ET[et.id]?' open':'')+'>'+
      '<summary><span class="caret">▶</span><span class="ename">'+esc(et.nome)+'</span>'+
      '<span class="ecount">'+nCats+' '+(nCats===1?'categoria':'categorias')+' · '+itens.length+' '+(itens.length===1?'tópico':'tópicos')+' · '+totT+' '+(totT===1?'tarefa':'tarefas')+'</span></summary>'+
      '<div class="etapabody">'+
        (itens.length ? agruparTopicosPorCategoriaHtml(itens, et.id) : '<p style="color:var(--dim);font-size:13px;margin:6px 0">Nenhum tópico nesta etapa ainda.</p>') +
        '<button class="microadd" data-act="item-new" data-etapa="'+et.id+'" style="padding:10px">+ Novo tópico</button>'+
      '</div></details>';
  });
  $("main").innerHTML = html;
  $("main").onclick = onOpClick;
  ligarFiltrosOp();
  Array.prototype.forEach.call(document.querySelectorAll("[data-etlist]"), function(host){
    ligarDragLista(host, "/api/eventos/"+EV.evento.id+"/op/reordenar");
  });
}

function onOpClick(e){
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act");
  var id = +el.getAttribute("data-id");
  if (act === "go-campo"){ e.preventDefault(); location.hash = "#/e/"+EV.evento.id+"/campo"; return; }
  // ações dentro de <summary> não devem alternar o acordeão
  if (act==="item-edit"||act==="item-new"||act==="tar-status"||act==="tar-edit"||act==="tar-del"||act==="tar-add"||act==="painel-toggle"||act==="painel-exp-pdf"||act==="ir-tarefa"||act==="ir-categoria"||act==="ir-etapa"||act==="cat-del"){
    e.preventDefault(); e.stopPropagation();
  }
  if (act === "painel-toggle"){ PAINEL_OP_ABERTO = !PAINEL_OP_ABERTO; renderOperacao(); return; }
  if (act === "painel-exp-pdf"){ exportarPlanejamentoIndicadoresPDF(); return; }
  if (act === "ir-tarefa"){ irParaTarefaOp(+el.getAttribute("data-item"), +el.getAttribute("data-id")); return; }
  if (act === "ir-categoria"){ var cv=el.getAttribute("data-cat"); irParaCategoria(cv?+cv:null); return; }
  if (act === "ir-etapa"){ irParaEtapa(+el.getAttribute("data-et")); return; }
  if (act === "item-new"){ sheetOpItem(+el.getAttribute("data-etapa"), null); return; }
  if (act === "item-edit"){ var it=findItem(id); if(it) sheetOpItem(null, it); return; }
  if (act === "tar-status"){
    var r = findTarefaOp(id); if(!r) return;
    // Tarefa é um item de checklist simples (feito/não feito) — clique sempre
    // alterna entre os dois, sem passar por "andamento". Uma tarefa antiga que
    // ficou em "andamento" (não dá mais pra chegar nesse estado clicando) volta
    // direto pra "a fazer" no toque, em vez de avançar pra "concluído".
    var antigoT = r.tarefa.status;
    var novoT = antigoT === "concluido" ? "afazer" : (antigoT === "afazer" ? "concluido" : "afazer");
    r.tarefa.status = novoT;
    el.textContent = novoT==="concluido" ? "✓" : "";
    el.title = STATUS_TXT[novoT]+" — toque para mudar";
    var row = el.closest("[data-tarow]"); if (row) row.className = "st-"+novoT;
    // Depois de marcar/desmarcar, recarrega pra buscar o status do tópico/
    // categoria já recalculado no backend (recomputeItemStatus) — só o
    // patch otimista acima não é suficiente, porque o círculo do tópico é
    // um campo à parte (item.status), não recalculado no cliente.
    api("/api/op-tarefas/"+id,"PATCH",{status:novoT})
      .then(recarregarOperacao)
      .catch(function(er){ r.tarefa.status = antigoT; toast(er.message, true); return recarregarOperacao(); });
    return;
  }
  if (act === "tar-edit"){ var re=findTarefaOp(id); if(re) sheetOpTarefa(re.item.id, re.tarefa); return; }
  if (act === "tar-del"){
    if (!confirm("Excluir esta tarefa?")) return;
    api("/api/op-tarefas/"+id,"DELETE").then(function(){ toast("Tarefa excluída"); return recarregarOperacao(); }).catch(function(er){ toast(er.message, true); });
    return;
  }
  if (act === "tar-add"){ sheetOpTarefa(+el.getAttribute("data-item"), null); return; }
  if (act === "tar-subtog"){ toggleSubtarefaOp(id); return; }
  if (act === "cat-del"){
    var catId = +el.getAttribute("data-catid");
    var catNome = categoriaNome(catId);
    if (!confirm('Excluir a categoria "'+catNome+'" desta expedição? Todos os tópicos e tarefas dela aqui serão apagados — não dá para desfazer. A categoria continua disponível para as demais expedições e para novos eventos.')) return;
    api("/api/eventos/"+EV.evento.id+"/op/categorias/"+catId,"DELETE")
      .then(function(){ toast("Categoria removida desta expedição"); return recarregarOperacao(); })
      .catch(function(er){ toast(er.message, true); });
    return;
  }
}

function sheetOpTarefa(itemId, tarefa){
  var novo = !tarefa;
  tarefa = tarefa || { titulo:"", responsavel:"", data_limite:"", observacoes:"", subtarefas:[] };

  /* v4.35: modelo local das subtarefas (reconciliado no salvar), mesmo padrão de sheetTarefa */
  var subs = (tarefa.subtarefas||[]).map(function(s){
    return { id:s.id, titulo:s.titulo, concluido:s.concluido, _orig:s.titulo, _del:false };
  });

  abrirSheet(
    '<h2 class="anton">'+(novo?"Nova tarefa":"Editar tarefa")+'</h2>'+
    '<label class="top" for="ot_tit">O que precisa ser feito</label>'+
    '<input id="ot_tit" maxlength="300" placeholder="ex.: Confirmar período da reserva" value="'+esc(novo?"":tarefa.titulo)+'">'+
    '<div class="grid2">'+
      '<div><label class="top" for="ot_resp">Responsável</label><input id="ot_resp" maxlength="120" value="'+esc(novo?"":(tarefa.responsavel||""))+'"></div>'+
      '<div><label class="top" for="ot_prazo">Data limite</label><input type="date" id="ot_prazo" value="'+esc(novo?"":(tarefa.data_limite||""))+'"></div>'+
    '</div>'+
    '<label class="top">Subtarefas</label>'+
    '<div class="subedit" id="ot_subs"></div>'+
    '<div class="sline" style="margin-top:6px">'+
      '<input id="ot_subnew" maxlength="200" placeholder="+ Nova subtarefa">'+
      '<button class="btn2" type="button" id="ot_subadd">Adicionar</button>'+
    '</div>'+
    '<label class="top" for="ot_obs">Observações</label><textarea id="ot_obs" rows="2" maxlength="600">'+esc(novo?"":(tarefa.observacoes||""))+'</textarea>'+
    (novo ? '' : (anexosBlock()+historicoBlock()))+
    '<div class="actions">'+(novo?'<button class="btn2" data-close>Cancelar</button>':'<button class="btn-danger" id="ot_del">Excluir</button>')+
    '<button class="btn" id="ot_ok">'+(novo?"Adicionar":"Salvar")+'</button></div>'
  );
  if (!novo){ ligarAnexos("op_tarefa", tarefa.id); ligarHistorico("op_tarefa", tarefa.id); }

  /* ----- editor de subtarefas (idêntico ao de sheetTarefa) ----- */
  function pintarSubs(){
    var cont = $("ot_subs"); if (!cont) return;
    var vivos = subs.filter(function(s){ return !s._del; });
    cont.innerHTML = vivos.length ? vivos.map(function(s){
      var idx = subs.indexOf(s);
      return '<div class="sline"><input data-subidx="'+idx+'" maxlength="200" value="'+esc(s.titulo)+'">' +
        '<button class="sdel" type="button" data-subdel="'+idx+'" title="Remover" aria-label="Remover subtarefa">✕</button></div>';
    }).join("") : '<div class="meta">Nenhuma subtarefa ainda.</div>';
    Array.prototype.forEach.call(cont.querySelectorAll("[data-subidx]"), function(inp){
      inp.oninput = function(){ subs[+inp.getAttribute("data-subidx")].titulo = inp.value; };
    });
    Array.prototype.forEach.call(cont.querySelectorAll("[data-subdel]"), function(b){
      b.onclick = function(){ subs[+b.getAttribute("data-subdel")]._del = true; pintarSubs(); };
    });
  }
  function addSub(){
    var v = $("ot_subnew").value.trim(); if (!v) return;
    subs.push({ titulo:v, concluido:0, _orig:null, _del:false });
    $("ot_subnew").value = ""; pintarSubs(); $("ot_subnew").focus();
  }
  pintarSubs();
  $("ot_subadd").onclick = addSub;
  $("ot_subnew").addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); addSub(); } });

  $("ot_ok").onclick = function(){
    var tit = $("ot_tit").value.trim(); if (!tit) return toast("Escreva a tarefa", true);
    var body = { titulo:tit, responsavel:$("ot_resp").value.trim(), data_limite:$("ot_prazo").value.trim(), observacoes:$("ot_obs").value.trim() };
    $("ot_ok").disabled = true;
    var salvarT = novo
      ? api("/api/op-itens/"+itemId+"/tarefas","POST",body).then(function(r){ return (r&&r.tarefa) ? r.tarefa.id : null; })
      : api("/api/op-tarefas/"+tarefa.id,"PATCH",body).then(function(){ return tarefa.id; });
    salvarT.then(function(tid){
      var ops = [];
      subs.forEach(function(s){
        var tt = (s.titulo||"").trim();
        if (s.id && s._del){ ops.push(api("/api/op-subtarefas/"+s.id,"DELETE")); return; }
        if (s._del || !tt) return;
        if (!s.id){ if (tid) ops.push(api("/api/op-tarefas/"+tid+"/subtarefas","POST",{titulo:tt})); return; }
        if (tt !== s._orig){ ops.push(api("/api/op-subtarefas/"+s.id,"PATCH",{titulo:tt})); }
      });
      return Promise.all(ops);
    }).then(function(){ fecharSheet(); return recarregarOperacao(); })
     .catch(function(e){ $("ot_ok").disabled=false; toast(e.message, true); });
  };
  if (!novo){ var d=$("ot_del"); if(d) d.onclick = function(){
    if (!confirm("Excluir esta tarefa?")) return;
    api("/api/op-tarefas/"+tarefa.id,"DELETE").then(function(){ fecharSheet(); toast("Tarefa excluída"); return recarregarOperacao(); }).catch(function(e){ toast(e.message, true); });
  }; }
  setTimeout(function(){ $("ot_tit").focus(); }, 50);
}

/* ============================================================
   v4.1 · Operação em Campo (campo_*) — por dias, cronológico
   ============================================================ */
function carregarCampo(){
  $("main").innerHTML = '<p style="color:var(--dim)">Carregando…</p>';
  Promise.all([
    api("/api/eventos/"+EV.evento.id+"/campo"),
    // v4.42: lista de fornecedores é admin-only — pra equipe, falha em
    // silêncio e mantém o que já tiver (a leitura do contato já vinculado
    // em cada tarefa não depende disso, vem embutida na resposta acima).
    api("/api/fornecedores").catch(function(){ return { fornecedores: FORN||[] }; })
  ]).then(function(rs){
    CAMPO = rs[0].dias || []; FORN = rs[1].fornecedores || FORN || [];
    renderCampo();
    // v4.42: atualiza sozinho — pega tarefa concluída por outro celular e
    // reavalia o destaque de atraso, sem precisar recarregar a tela.
    pollTimer = setInterval(function(){
      if (document.visibilityState !== "visible") return;
      if ($("overlay").classList.contains("on")) return;
      var ae = document.activeElement;
      if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
      api("/api/eventos/"+EV.evento.id+"/campo").then(function(nj){ CAMPO = nj.dias||[]; renderCampo(); }).catch(function(){});
    }, 25000);
  }).catch(function(e){ $("main").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
}
function recarregarCampo(){
  return api("/api/eventos/"+EV.evento.id+"/campo").then(function(j){ CAMPO = j.dias || []; renderCampo(); })
    .catch(function(e){ toast(e.message, true); });
}
function findCT(id){ for(var a=0;a<CAMPO.length;a++){ var ts=CAMPO[a].tarefas||[]; for(var b=0;b<ts.length;b++) if(ts[b].id===id) return {dia:CAMPO[a],tarefa:ts[b]}; } return null; }
function findCD(id){ for(var a=0;a<CAMPO.length;a++) if(CAMPO[a].id===id) return CAMPO[a]; return null; }
function findCSub(id){ for(var a=0;a<CAMPO.length;a++){ var ts=CAMPO[a].tarefas||[]; for(var b=0;b<ts.length;b++){ var ss=ts[b].subs||[]; for(var c=0;c<ss.length;c++) if(ss[c].id===id) return ss[c]; } } return null; }

/* v4.43: "HH:MM" -> minutos, pra ordenar por horário de verdade (não por
   texto) — mesmo formato estrito já usado no reajuste em cascata (worker.js
   hhmmMin). Sem horário válido (vazio, "--:--" etc.) fica por último. */
function minutosHorario(s){
  var m = String(s||"").trim().match(/^(\d{1,2}):(\d{2})$/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function tarefasCampoPorHorario(ts){
  return (ts||[]).slice().sort(function(a,b){
    var ma = minutosHorario(a.h_planejado), mb = minutosHorario(b.h_planejado);
    if (ma==null && mb==null) return 0;
    if (ma==null) return 1;
    if (mb==null) return -1;
    return ma - mb;
  });
}
/* v4.42: minutos desde meia-noite, agora. */
function minutosAgora(){ var d = new Date(); return d.getHours()*60 + d.getMinutes(); }
/* v4.42: link direto pro WhatsApp — limpa o telefone e garante o código do
   país (55) na frente, sem duplicar quando já vier com ele. */
function linkWhatsapp(tel){
  var d = String(tel||"").replace(/\D/g,"");
  if (!d) return null;
  if (d.length <= 11) d = "55" + d;
  return "https://wa.me/" + d;
}
function renderCampo(){
  var html = '<p style="color:var(--mut);font-size:13px;margin:2px 0 14px">Cada dia em ordem cronológica. Tarefa <b>Ajustável</b> reajusta as próximas ao registrar o horário real; <b>Fixa</b> não move as outras.</p>'+
    '<button class="btn2" id="an_op" style="width:100%;margin-bottom:14px">🔎 Analisar Operação</button>'+
    '<div id="an_out"></div>';
  if (!CAMPO.length) html += '<div class="empty" style="margin-bottom:12px">Nenhum dia cadastrado ainda. Comece criando o Dia 1.</div>';
  CAMPO.forEach(function(d){
    var ts = tarefasCampoPorHorario(d.tarefas);
    var done = ts.filter(function(t){ return t.status==="concluido"; }).length;
    html += '<div class="dayblock">'+
      '<div class="dayhead"><h3 class="anton">'+esc(d.rotulo)+'</h3>'+
      '<div class="dayactions"><span class="cnt">'+done+'/'+ts.length+'</span>'+
      '<button class="daysort" data-act="cd-edit" data-id="'+d.id+'">editar dia</button></div></div>'+
      ts.map(ctarefaHtml).join('')+
      '<button class="addrow" data-act="ct-new" data-dia="'+d.id+'">+ Tarefa</button>'+
      '</div>';
  });
  html += '<button class="btn2" data-act="cd-new" style="width:100%;margin-top:8px">+ Novo dia</button>';
  $("main").innerHTML = html;
  $("main").onclick = onCampoClick;
  $("an_op").onclick = analisarOperacaoUI;
}

function analisarOperacaoUI(){
  var btn = $("an_op"), out = $("an_out");
  btn.disabled = true; btn.textContent = "Analisando…";
  out.innerHTML = "";
  api("/api/eventos/"+EV.evento.id+"/analisar","POST",{}).then(function(j){
    btn.disabled = false; btn.textContent = "🔎 Analisar Operação";
    var a = j.analise || {};
    var secoes = [
      ["resumo","Resumo"], ["pendencias","Pendências"], ["atrasos","Atrasos"], ["riscos","Riscos"],
      ["inconsistencias","Inconsistências"], ["prioridades","Prioridades"], ["oportunidades","Oportunidades"]
    ];
    out.innerHTML = '<div class="dayblock" style="margin-bottom:14px">'+
      secoes.map(function(s){
        var v = a[s[0]];

        if (!v || !v.length) return '';
        return '<label class="top" style="margin-top:12px">'+s[1]+'</label>'+
          '<ul style="margin:6px 0 0 18px;padding:0;font-size:13px;color:var(--mut)">'+
            v.map(function(x){ return '<li style="margin-bottom:4px">'+esc(x)+'</li>'; }).join('')+
          '</ul>';
      }).join('') + '</div>';
  }).catch(function(e){
    btn.disabled = false; btn.textContent = "🔎 Analisar Operação";
    out.innerHTML = '<div class="empty" style="margin-bottom:14px">'+esc(e.message)+'</div>';
  });
}

function ctarefaHtml(t){
  var subs = t.subs || [];
  var subsDone = subs.filter(function(s){ return s.concluido; }).length;
  var subHtml = subs.map(function(s){
    return '<button class="subrow'+(s.concluido?' done':'')+'" data-act="cst-chk" data-id="'+s.id+'">'+
      '<span class="subchk">'+(s.concluido?'✓':'')+'</span><span class="subtxt">'+esc(s.titulo)+'</span></button>';
  }).join('');
  // v4.42: passou do horário previsto e ainda não concluída -> destaque em vermelho.
  var hm = minutosHorario(t.h_planejado);
  var atrasada = t.status!=="concluido" && hm!=null && hm < minutosAgora();
  var waLink = t.forn_telefone ? linkWhatsapp(t.forn_telefone) : null;
  var contatoHtml = t.forn_nome
    ? (waLink
        ? '<a class="contato-wa" href="'+esc(waLink)+'" target="_blank" rel="noopener">'+
            '<span class="wa-ico">💬</span>'+
            '<span class="wa-info"><b>'+esc(t.forn_contato||t.forn_nome)+'</b>'+(t.forn_categoria?' — '+esc(t.forn_categoria):'')+'<br>Abrir no WhatsApp</span>'+
          '</a>'
        : '<div class="contato-wa" style="opacity:.7"><span class="wa-info"><b>'+esc(t.forn_contato||t.forn_nome)+'</b>'+(t.forn_categoria?' — '+esc(t.forn_categoria):'')+'<br>Sem telefone cadastrado</span></div>')
    : '';
  return '<div class="ctarefa st-'+t.status+(atrasada?' atrasada':'')+'">'+
    '<div class="htime"><b>'+esc(t.h_planejado||'--:--')+'</b><small>previsto</small>'+
      (t.h_realizado?'<div class="real">'+esc(t.h_realizado)+'</div>':'')+'</div>'+
    '<div class="cinfo">'+
      '<div class="cn">'+esc(t.nome)+'</div>'+
      '<div class="csub">'+
        '<span class="tipotag '+t.tipo+'">'+(t.tipo==="fixa"?"Fixa":"Ajustável")+'</span>'+
        (atrasada?'<span style="color:var(--p1);font-weight:700">atrasada</span>':'')+
        (t.responsavel?'<span>'+esc(t.responsavel)+'</span>':'')+
        (t.data_limite?'<span>prazo '+esc(t.data_limite)+'</span>':'')+
        (subs.length?'<span>'+subsDone+'/'+subs.length+' checks</span>':'')+
        '<button class="daysort" data-act="ct-realizar" data-id="'+t.id+'">⏱ realizado</button>'+
        '<button class="daysort" data-act="ct-edit" data-id="'+t.id+'">editar</button>'+
        '<button class="daysort" data-act="cst-add" data-tarefa="'+t.id+'">+ check</button>'+
      '</div>'+
      contatoHtml+
      (subHtml?'<div class="subs" style="margin-left:0">'+subHtml+'</div>':'')+
    '</div>'+

function onCampoClick(e){
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act"), id = +el.getAttribute("data-id");
  if (act === "cd-new"){ sheetCampoDia(null); return; }
  if (act === "cd-edit"){ var d=findCD(id); if(d) sheetCampoDia(d); return; }
  if (act === "ct-new"){ sheetCampoTarefa(+el.getAttribute("data-dia"), null); return; }
  if (act === "ct-edit"){ var r=findCT(id); if(r) sheetCampoTarefa(r.dia.id, r.tarefa); return; }
  if (act === "ct-realizar"){ var rr=findCT(id); if(rr) sheetRealizar(rr.tarefa); return; }
  if (act === "ct-status"){
    var r2=findCT(id); if(!r2) return;
    // v4.42: um toque só — alterna direto entre "a fazer" e "concluído",
    // sem passar por "andamento" (mesmo padrão do Planejamento Operacional),
    // pra dar pra concluir com um único toque durante a operação.
    var next = r2.tarefa.status === "concluido" ? "afazer" : "concluido";
    r2.tarefa.status = next;
    api("/api/campo-tarefas/"+id,"PATCH",{status:next,atualizado_por:NOME}).then(recarregarCampo).catch(function(er){ toast(er.message,true); });
    return;
  }
  if (act === "cst-chk"){
    var s=findCSub(id); if(!s) return; var novo=s.concluido?0:1; s.concluido=novo;
    el.classList.toggle("done",!!novo); var chk=el.querySelector(".subchk"); if(chk) chk.textContent=novo?'✓':'';
    api("/api/campo-subtarefas/"+id,"PATCH",{concluido:novo}).catch(function(er){ toast(er.message,true); });
    return;
  }
  if (act === "cst-add"){ sheetCampoSub(+el.getAttribute("data-tarefa")); return; }
}

function carregarProgramacao(){
  $("main").innerHTML = '<p style="color:var(--dim)">Carregando…</p>';
  Promise.all([
    api("/api/eventos/"+EV.evento.id+"/programacao"),
    // fornecedores é admin-only — pra equipe, falha em silêncio (o contato já
    // vinculado em cada tarefa vem embutido na resposta acima, não depende disso).
    api("/api/fornecedores").catch(function(){ return { fornecedores: FORN||[] }; })
  ]).then(function(rs){
    PROG = rs[0].acontecimentos || []; FORN = rs[1].fornecedores || FORN || [];
    renderProgramacao();
  }).catch(function(e){ $("main").innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; });
}
function recarregarProgramacao(){
  return api("/api/eventos/"+EV.evento.id+"/programacao").then(function(j){ PROG = j.acontecimentos || []; renderProgramacao(); })
    .catch(function(e){ toast(e.message, true); });

function findSubProg(id){ for (var a=0;a<PROG.length;a++){ var ts=PROG[a].tarefas||[]; for(var b=0;b<ts.length;b++){ var ss=ts[b].subtarefas||[]; for(var c=0;c<ss.length;c++) if(ss[c].id===id) return ss[c]; } } return null; }

}

/* Acontecimento — mesmo card/acordeão visual do tópico do Planejamento
   Operacional (.opitem), só que a contagem "x/y" ganha a palavra pendente/
   atrasado ao lado (ver seção 6 do pedido) em vez de ficar só no círculo. */
function acontecimentoHtml(a){
  var tarefas = a.tarefas || [];
  var total = tarefas.length, feitas = 0;
  tarefas.forEach(function(t){ if (t.status==="concluido") feitas++; });
  var hoje = isoHoje(0);
  var atrasado = a.status!=="concluido" && tarefas.some(function(t){ return t.status!=="concluido" && t.data_limite && t.data_limite < hoje; });
  var check = a.status==="concluido" ? "✓" : "";
  var contagemTxt = total===0 ? "0 tarefas" : (feitas+"/"+total);
  var estadoHtml = total===0 ? "" :
    a.status==="concluido" ? "" :
    atrasado ? '<span style="color:var(--p1);font-weight:700;font-size:11px;margin-left:6px">atrasado</span>' :
    '<span style="color:var(--warn);font-weight:700;font-size:11px;margin-left:6px">pendente</span>';
  return '<details class="opitem st-'+a.status+(atrasado?' atrasada':'')+'" data-id="'+a.id+'" data-row="'+a.id+'"'+(OPEN_AC[a.id]?' open':'')+'>'+
    '<summary>'+
      '<span class="draghandle" style="cursor:grab;color:var(--dim);margin-right:2px">⠿</span>'+
      '<span class="stbtn" title="'+STATUS_TXT[a.status]+' — automático, conforme as tarefas" style="margin-right:6px">'+check+'</span>'+
      '<span class="inm">'+esc(a.nome)+'</span>'+
      '<span class="ecount">'+contagemTxt+estadoHtml+'</span>'+
      '<button class="ipgear" data-act="ac-edit" data-id="'+a.id+'" title="Editar acontecimento">⚙</button>'+
    '</summary>'+
    '<div class="opbody" style="padding:2px 13px 10px">'+
      (a.categoria ? '<div class="meta" style="margin:2px 0 8px">'+esc(a.categoria)+'</div>' : '')+
      (tarefas.length ? tarefas.map(tarefaProgHtml).join('') : '<p style="color:var(--dim);font-size:13px;margin:4px 0">Nenhuma tarefa ainda.</p>')+
      '<button class="microadd" data-act="tar-add" data-ac="'+a.id+'" style="padding:8px;margin-top:8px">+ Tarefa</button>'+
    '</div></details>';
}

function filtroProgAtivo(){
  return !!(FILTROS_PROG.categoria || FILTROS_PROG.fornecedor_id || FILTROS_PROG.responsavel || FILTROS_PROG.status);
}
function tarefasFiltradasProg(){
  var resp = FILTROS_PROG.responsavel.toLowerCase();
  var out = [];
  PROG.forEach(function(a){
    if (FILTROS_PROG.categoria && (a.categoria||"") !== FILTROS_PROG.categoria) return;
    (a.tarefas||[]).forEach(function(t){
      if (resp && (t.responsavel||"").toLowerCase().indexOf(resp) < 0) return;
      if (FILTROS_PROG.status && t.status !== FILTROS_PROG.status) return;
      if (FILTROS_PROG.fornecedor_id && t.fornecedor_id !== +FILTROS_PROG.fornecedor_id) return;
      out.push({ t:t, ac:a });
    });
  });
  out.sort(function(x,y){
    var da = x.ac.data || "9999-99-99", db2 = y.ac.data || "9999-99-99";
    return da < db2 ? -1 : (da > db2 ? 1 : 0);
  });
  return out;
}

  var opcoesCat = categoriasProgUsadas().map(function(c){ return '<option value="'+esc(c)+'"'+(FILTROS_PROG.categoria===c?' selected':'')+'>'+esc(c)+'</option>'; }).join('');

  return '<div class="dayblock" style="margin-bottom:14px">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'+
      '<label class="top" style="margin-top:0">Filtros</label>'+

    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+
      '<input id="fpg_resp" list="dl_pg_resp" placeholder="Responsável" value="'+esc(FILTROS_PROG.responsavel)+'" style="flex:1;min-width:140px">'+
      '<datalist id="dl_pg_resp">'+responsaveisProg().map(function(r){ return '<option value="'+esc(r)+'">'; }).join('')+'</datalist>'+
      '<select id="fpg_status" style="flex:1;min-width:130px"><option value="">Status (todos)</option>'+
        ['afazer','concluido'].map(function(s){ return '<option value="'+s+'"'+(FILTROS_PROG.status===s?' selected':'')+'>'+STATUS_TXT[s]+'</option>'; }).join('')+
      '</select>'+
      '<select id="fpg_cat" style="flex:1;min-width:150px"><option value="">Categoria (todas)</option>'+opcoesCat+'</select>'+
      (opcoesForn ? '<select id="fpg_forn" style="flex:1;min-width:150px"><option value="">Fornecedor (todos)</option>'+opcoesForn+'</select>' : '')+
    '</div></div>';
