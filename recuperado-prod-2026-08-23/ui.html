function renderProgramacao(){
  snapOpenProg();
  var html = '<p style="color:var(--mut);font-size:13px;margin:2px 0 14px">Data → Acontecimento → Tarefas, na ordem real da expedição. Cada acontecimento mostra quantas das suas tarefas já estão resolvidas.</p>';
  html += filtrosProgHtml();
  html += '<button class="btn" data-act="ac-new" style="width:100%;margin-bottom:14px">+ Adicionar acontecimento</button>';

  if (filtroProgAtivo()){
    var res = tarefasFiltradasProg();
    html += '<div class="dayblock">'+
      '<label class="top" style="margin-top:0">'+res.length+' tarefa'+(res.length===1?'':'s')+' encontrada'+(res.length===1?'':'s')+'</label>'+
      (res.length
        ? '<div style="margin-top:8px">'+res.map(linhaTarefaFiltradaProgHtml).join('')+'</div>'
        : '<div class="empty" style="margin-top:8px">Nenhuma tarefa bate com esses filtros.</div>')+
    '</div>';

    ligarFiltrosProg();

    return;
  }

  if (!PROG.length) html += '<div class="empty">Nenhum acontecimento cadastrado ainda.</div>';
  var porDia = {};
  PROG.forEach(function(a){ (porDia[a.data||''] = porDia[a.data||''] || []).push(a); });
  Object.keys(porDia).sort().forEach(function(d){
    var lista = porDia[d].slice().sort(function(x,y){ return (x.ordem||0)-(y.ordem||0); });
    var totT=0, doneT=0;
    lista.forEach(function(a){ (a.tarefas||[]).forEach(function(t){ totT++; if(t.status==="concluido") doneT++; }); });
    html += '<div class="dayblock">'+
      '<div class="dayhead"><h3 class="anton">'+(d?esc(fmtDataBR(d)):'Sem data')+'</h3>'+
        (totT ? '<span class="cnt">'+doneT+'/'+totT+' tarefas</span>' : '')+
      '</div>'+
      '<div data-aclist="'+esc(d)+'">'+lista.map(acontecimentoHtml).join('')+'</div>'+
    '</div>';
  });
  $("main").innerHTML = html;
  $("main").onclick = onProgClick;
  ligarFiltrosProg();
  Array.prototype.forEach.call(document.querySelectorAll("[data-aclist]"), function(host){
    ligarDragLista(host, "/api/eventos/"+EV.evento.id+"/programacao/reordenar");
  });
}

function onProgClick(e){
  var el = e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el) return;
  var act = el.getAttribute("data-act");
  var id = +el.getAttribute("data-id");
  if (act==="ac-edit"||act==="ac-new"||act==="tar-status"||act==="tar-edit"||act==="tar-del"||act==="tar-add"||act==="ir-tarefa-prog"){
    e.preventDefault(); e.stopPropagation();
  }
  if (act === "ac-new"){ sheetProgAcontecimento(null); return; }
  if (act === "ac-edit"){ var a=findAcontecimento(id); if(a) sheetProgAcontecimento(a); return; }
  if (act === "ir-tarefa-prog"){ irParaTarefaProg(+el.getAttribute("data-ac"), +el.getAttribute("data-id")); return; }
  if (act === "tar-status"){
    var r = findTarefaProg(id); if(!r) return;
    var antigo = r.tarefa.status;
    var novo = antigo === "concluido" ? "afazer" : "concluido";
    r.tarefa.status = novo;
    el.textContent = novo==="concluido" ? "✓" : "";
    el.title = STATUS_TXT[novo]+" — toque para mudar";
    var row = el.closest("[data-tarow]"); if (row) row.className = "st-"+novo;
    // idem tar-status do Planejamento Operacional: recarrega pra buscar o
    // status do acontecimento já recalculado no backend (recomputeAcontecimentoStatus).
    api("/api/prog-tarefas/"+id,"PATCH",{status:novo})
      .then(recarregarProgramacao)
      .catch(function(er){ r.tarefa.status = antigo; toast(er.message, true); return recarregarProgramacao(); });
    return;
  }
  if (act === "tar-edit"){ var re=findTarefaProg(id); if(re) sheetProgTarefa(re.ac.id, re.tarefa); return; }
  if (act === "tar-del"){
    if (!confirm("Excluir esta tarefa?")) return;
    api("/api/prog-tarefas/"+id,"DELETE").then(function(){ toast("Tarefa excluída"); return recarregarProgramacao(); }).catch(function(er){ toast(er.message, true); });
    return;
  }
  if (act === "tar-add"){ sheetProgTarefa(+el.getAttribute("data-ac"), null); return; }
  if (act === "tar-subtog"){ toggleSubtarefaProg(id); return; }
}

function renderTarefas(){
  var tot=TA.length, done=0, and=0, hoje=0;
  TA.forEach(function(t){
    if (t.status==="concluido") done++;
    if (t.status==="andamento") and++;
    if (t.status!=="concluido" && (t.data_limite||"").toLowerCase()==="hoje") hoje++;
  });
  var pct = tot ? Math.round(done/tot*100) : 0;
  var resps = tUniques("responsavel"), setores = tUniques("setor");
  function opts(list, sel){
    return list.map(function(v){ return '<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(v)+'</option>'; }).join("");
  }
  var q = TFILT.q.toLowerCase();
  var lista = TA.filter(function(t){
    if (TFILT.status && t.status !== TFILT.status) return false;
    if (TFILT.prio && String(t.prioridade==null?"":t.prioridade) !== TFILT.prio) return false;
    if (TFILT.resp && t.responsavel !== TFILT.resp) return false;
    if (TFILT.setor && t.setor !== TFILT.setor) return false;
    if (q && (t.titulo+" "+t.setor+" "+t.responsavel+" "+t.observacoes).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  var temFiltro = TFILT.q||TFILT.status||TFILT.prio||TFILT.resp||TFILT.setor;
  var arrastavel = !temFiltro;

  /* prioridades realmente em uso (1 a 40) */
  var prios = {};

  ligarDragLista($("fd_lista"), "/api/focos-do-dia/reordenar");

  $("t_q").oninput = debounce(function(){ TFILT.q = this.value; renderTarefas(); }, 250);
  ["status","prio","resp","setor"].forEach(function(f){

  Array.prototype.forEach.call(document.querySelectorAll("[data-tst]"), function(b){

  Array.prototype.forEach.call(document.querySelectorAll("[data-subtogt]"), function(b){

  var ts = $("t_sort");

function rowTarefa(t, arrastavel){
  var sub = [];
  if (t.horario) sub.push('<span class="hr">'+esc(t.horario)+'</span>');
  if (t.setor) sub.push(esc(t.setor));
  if (t.responsavel) sub.push(esc(t.responsavel));
  if (t.data_limite) sub.push(t.data_limite.toLowerCase()==="hoje"?'<span style="color:var(--warn);font-weight:600">Hoje</span>':"até "+esc(t.data_limite));
  if (t.observacoes) sub.push(esc(t.observacoes.length>60 ? t.observacoes.slice(0,60)+"…" : t.observacoes));
  var subs = t.subtarefas || [];
  if (subs.length){
    var feitas = 0; subs.forEach(function(s){ if (s.concluido) feitas++; });
    sub.push('<span class="subcnt">'+feitas+'/'+subs.length+' subtarefas</span>');
  }
  var check = t.status==="concluido" ? "✓" : "";
  var subsHtml = subs.length ? '<div class="subs">' + subs.map(function(s){
      return '<button class="subrow'+(s.concluido?' done':'')+'" data-subtogt="'+s.id+'">' +
        '<span class="subchk">'+(s.concluido?'✓':'')+'</span>' +
        '<span class="subtxt">'+esc(s.titulo)+'</span></button>';
    }).join("") + '</div>' : '';
  return '<div class="itemwrap" data-wrap="'+t.id+'">' +
    '<div class="row st-'+t.status+'" data-tedit="'+t.id+'" role="button" tabindex="0">' +
    (arrastavel ? '<span class="draghandle" title="Arrastar para reordenar" aria-hidden="true">⋮⋮</span>' : '') +
    '<button class="stbtn" data-tst="'+t.id+'" title="'+STATUS_TXT[t.status]+' — toque para mudar" aria-label="Mudar status: '+STATUS_TXT[t.status]+'">'+check+'</button>' +
    '<div class="info"><div class="nm">'+esc(t.titulo)+'</div>' +
    (sub.length?'<div class="sub"><span>'+sub.join("</span><span>")+'</span></div>':'') +
    '</div>' +
    (t.prioridade!=null ? '<span class="pbadge'+(t.prioridade<=1?' p1':'')+'">P'+t.prioridade+'</span>' : '') +
    '</div>' +
    subsHtml +
    '</div>';
}

/* v3.6: alterna a conclusão de uma subtarefa de tarefa geral (otimista) */
function toggleSubtarefa(sid){
  var sub=null;
  TA.forEach(function(t){ (t.subtarefas||[]).forEach(function(s){ if(s.id===sid) sub=s; }); });
  if (!sub) return;
  var antes = sub.concluido;
  sub.concluido = antes ? 0 : 1; renderTarefas();
  api("/api/subtarefas/"+sid, "PATCH", { concluido: sub.concluido })
    .catch(function(){ sub.concluido = antes; renderTarefas();
      toast("Sem conexão — a subtarefa não foi salva. Tente de novo.", true); });
}

/* v3.6: grava a nova ordem das tarefas (otimista) e persiste */
function salvarOrdemTarefas(ids){
  ids.forEach(function(id, idx){ var t = TA.find(function(x){ return x.id===id; }); if (t) t.ordem = idx+1; });
  TA.sort(function(a,b){
    var ca=a.status==="concluido"?1:0, cb=b.status==="concluido"?1:0;
    return ca-cb || (a.ordem||1e9)-(b.ordem||1e9) || a.id-b.id;
  });
  return api("/api/tarefas/reordenar", "POST", { ids: ids })
    .catch(function(){ toast("Não deu pra salvar a ordem. Recarregando…", true);
      api("/api/tarefas").then(function(j){ TA=j.tarefas||[]; renderTarefas(); }); });
}

/* v3.6: reordena as tarefas por prioridade (P1 primeiro; sem prioridade por último) */
function ordenarTarefasPorPrioridade(){
  var arr = TA.slice().sort(function(a,b){
    var pa=a.prioridade==null?1e9:a.prioridade, pb=b.prioridade==null?1e9:b.prioridade;
    return pa-pb || (a.ordem||1e9)-(b.ordem||1e9) || a.id-b.id;
  });
  salvarOrdemTarefas(arr.map(function(t){ return t.id; }));
  renderTarefas();
}

/* v3.6: arrastar tarefas na lista (mesmo padrão do checklist) */
function ligarDragTarefas(){
  var container = document.querySelector(".items");
  if (!container) return;
  Array.prototype.forEach.call(container.querySelectorAll(".draghandle"), function(handle){
    handle.onclick = function(e){ e.stopPropagation(); };
    handle.addEventListener("pointerdown", function(ev){
      ev.preventDefault();
      var wrap = handle.parentNode.parentNode;
      if (!wrap || !wrap.classList.contains("itemwrap")) return;
      wrap.classList.add("dragging");
      try { handle.setPointerCapture(ev.pointerId); } catch(_){}
      function onMove(e){
        var after = null;
        var rows = Array.prototype.slice.call(container.querySelectorAll(".itemwrap:not(.dragging)"));
        for (var i=0;i<rows.length;i++){
          var rect = rows[i].getBoundingClientRect();
          if (e.clientY < rect.top + rect.height/2){ after = rows[i]; break; }
        }
        if (after) container.insertBefore(wrap, after); else container.appendChild(wrap);
      }
      function onUp(){
        try { handle.releasePointerCapture(ev.pointerId); } catch(_){}
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
        wrap.classList.remove("dragging");
        var ids = Array.prototype.map.call(container.querySelectorAll(".itemwrap"),
          function(w){ return +w.getAttribute("data-wrap"); });
        salvarOrdemTarefas(ids);
      }
      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
    });
  });
}

function cicloTarefa(id){
  var t = TA.find(function(x){ return x.id===id; });
  if (!t) return;
  var novo = STATUS_SEQ[t.status] || "afazer";
  var antigo = t.status;
  t.status = novo; renderTarefas();
  api("/api/tarefas/"+id, "PATCH", { status: novo, atualizado_por: NOME })
    .catch(function(){ t.status = antigo; renderTarefas();
      toast("Sem conexão — o status não foi salvo. Tente de novo.", true); });
}

/* opções fixas dos campos de tarefa (dropdowns) */
var TAREFA_SETORES = ["Diário","Compra e venda","Expedição","Vestuário","Marcas","Manutenção","Pessoal","Evento"];
var TAREFA_RESPS   = ["Gustavo","Zana","Ana","Pedrinho","Anai","Prestador de serviços","Outros"];
function selectFixo(id, lista, atual){
  var val = String(atual||"");
  var extra = (val && lista.indexOf(val)<0) ? '<option value="'+esc(val)+'" selected>'+esc(val)+' (antigo)</option>' : '';
  return '<select id="'+id+'"><option value="">—</option>' +
    lista.map(function(v){ return '<option value="'+esc(v)+'"'+(v===val?' selected':'')+'>'+esc(v)+'</option>'; }).join("") + extra + '</select>';
}

function sheetTarefa(id){
  var t = id ? TA.find(function(x){ return x.id===id; }) : null;
  var novo = !t;
  t = t || { titulo:"", setor:"", status:"afazer", prioridade:"", data_limite:"", responsavel:"", horario:"", observacoes:"", subtarefas:[] };

  /* modelo local das subtarefas (reconciliado no salvar) */
  var subs = (t.subtarefas||[]).map(function(s){
    return { id:s.id, titulo:s.titulo, concluido:s.concluido, _orig:s.titulo, _del:false };
  });

  abrirSheet(
    '<h2 class="anton">'+(novo?'Nova tarefa':'Editar tarefa')+'</h2>' +
    (!novo && t.atualizado_por ? '<div class="meta">Última alteração: '+esc(t.atualizado_por)+' · '+fmtData(t.atualizado_em)+'</div>' : '') +
    '<label class="top" for="tf_tit">Tarefa *</label>' +
    '<input id="tf_tit" maxlength="300" value="'+esc(t.titulo)+'" placeholder="ex.: Precificar expedição Tavares">' +
    '<div class="grid2">' +
      '<div><label class="top">Setor</label>'+selectFixo("tf_setor", TAREFA_SETORES, t.setor)+'</div>' +
      '<div><label class="top">Responsável</label>'+selectFixo("tf_resp", TAREFA_RESPS, t.responsavel)+'</div>' +
      '<div><label class="top">Status</label><select id="tf_st">' +
        ['afazer','andamento','concluido'].map(function(st){
          return '<option value="'+st+'"'+(t.status===st?' selected':'')+'>'+STATUS_TXT[st]+'</option>'; }).join("") +
      '</select></div>' +
      '<div><label class="top" for="tf_prio">Prioridade (1–40)</label>' +
        '<input id="tf_prio" type="number" min="1" max="40" step="1" value="'+(t.prioridade!=null&&t.prioridade!==""?esc(String(t.prioridade)):"")+'" placeholder="ex.: 1"></div>' +
      '<div><label class="top" for="tf_dl">Data limite</label><input id="tf_dl" maxlength="20" value="'+esc(t.data_limite)+'" placeholder="Hoje, 05/07…"></div>' +
      '<div><label class="top" for="tf_hora">Horário</label><input id="tf_hora" list="dl_thoras" maxlength="40" value="'+esc(t.horario||"")+'" placeholder="ex.: 14h, 08:30"></div>' +
    '</div>' +
    '<label class="top">Subtarefas</label>' +
    '<div class="subedit" id="tf_subs"></div>' +
    '<div class="sline" style="margin-top:6px">' +
      '<input id="tf_subnew" maxlength="200" placeholder="+ Nova subtarefa">' +
      '<button class="btn2" type="button" id="tf_subadd">Adicionar</button>' +
    '</div>' +
    '<label class="top">Observações</label>' +
    '<textarea id="tf_obs" maxlength="600">'+esc(t.observacoes)+'</textarea>' +
    '<datalist id="dl_thoras">'+tUniques("horario").map(function(v){return '<option value="'+esc(v)+'">';}).join("")+'</datalist>' +
    '<div class="actions">' +
      (novo ? '<button class="btn2" data-close>Cancelar</button>' : '<button class="btn-danger" id="tf_del">Excluir</button>') +
      '<button class="btn" id="tf_save">'+(novo?'Adicionar':'Salvar')+'</button>' +
    '</div>'
  );

  /* ----- editor de subtarefas ----- */
  function pintarSubs(){
    var cont = $("tf_subs"); if (!cont) return;
    var vivos = subs.filter(function(s){ return !s._del; });
    cont.innerHTML = vivos.length ? vivos.map(function(s){
      var idx = subs.indexOf(s);
      return '<div class="sline"><input data-subidx="'+idx+'" maxlength="200" value="'+esc(s.titulo)+'">' +
        '<button class="sdel" type="button" data-subdel="'+idx+'" title="Remover" aria-label="Remover subtarefa">✕</button></div>';
    }).join("") : '<div class="meta">Nenhuma subtarefa ainda.</div>';
    Array.prototype.forEach.call(cont.querySelectorAll("[data-subidx]"), function(inp){
      inp.oninput = function(){ subs[+inp.getAttribute("data-subidx")].titulo = inp.value; };
    });
    Array.prototype.forEach.call(cont.querySelectorAll("[data-subdel]"), function(b){
      b.onclick = function(){ subs[+b.getAttribute("data-subdel")]._del = true; pintarSubs(); };
    });
  }
  function addSub(){
    var v = $("tf_subnew").value.trim(); if (!v) return;
    subs.push({ titulo:v, concluido:0, _orig:null, _del:false });
    $("tf_subnew").value = ""; pintarSubs(); $("tf_subnew").focus();
  }
  pintarSubs();
  $("tf_subadd").onclick = addSub;
  $("tf_subnew").addEventListener("keydown", function(e){ if (e.key==="Enter"){ e.preventDefault(); addSub(); } });

  $("tf_save").onclick = function(){
    var pv = parseInt($("tf_prio").value, 10);
    var body = {
      titulo: $("tf_tit").value.trim(), setor: $("tf_setor").value.trim(),
      status: $("tf_st").value, prioridade: isFinite(pv) ? Math.max(1, Math.min(40, pv)) : null,
      data_limite: $("tf_dl").value.trim(), responsavel: $("tf_resp").value.trim(),
      horario: $("tf_hora").value.trim(), observacoes: $("tf_obs").value.trim(), atualizado_por: NOME
    };
    if (!body.titulo) return toast("O título é obrigatório", true);
    $("tf_save").disabled = true;
    var salvarT = novo
      ? api("/api/tarefas","POST",body).then(function(r){ return r.id || null; })
      : api("/api/tarefas/"+id,"PATCH",body).then(function(){ return id; });
    salvarT.then(function(tid){
      var ops = [];
      subs.forEach(function(s){
        var tt = (s.titulo||"").trim();
        if (s.id && s._del){ ops.push(api("/api/subtarefas/"+s.id,"DELETE")); return; }
        if (s._del || !tt) return;
        if (!s.id){ if (tid) ops.push(api("/api/tarefas/"+tid+"/subtarefas","POST",{titulo:tt})); return; }
        if (tt !== s._orig){ ops.push(api("/api/subtarefas/"+s.id,"PATCH",{titulo:tt})); }
      });
      return Promise.all(ops);
    }).then(function(){ fecharSheet(); toast(novo?"Tarefa adicionada":"Salvo");
      return api("/api/tarefas").then(function(j){ TA=j.tarefas||[]; renderTarefas(); }); })
     .catch(function(e){ $("tf_save").disabled=false; toast(e.message,true); });
  };
  var del = $("tf_del");
  if (del) del.onclick = function(){
    if (!confirm("Excluir esta tarefa? Não dá para desfazer.")) return;
    api("/api/tarefas/"+id,"DELETE").then(function(){ fecharSheet(); toast("Tarefa excluída");
      return api("/api/tarefas").then(function(j){ TA=j.tarefas||[]; renderTarefas(); }); })
      .catch(function(e){ toast(e.message,true); });
  };
  setTimeout(function(){ $("tf_tit").focus(); }, 50);
}

var CRM = [];
var CRMFILT = { q:"", etapa:"", pend:false };

var ETAPA_TXT = {}; ETAPAS.forEach(function(e){ ETAPA_TXT[e[0]] = e[1]; });
var ETAPA_CLS = { lead:"", contato:"", proposta:"warn", confirmado:"ok", pos_evento:"ok", perdido:"bad" };

function exportarCRMIndicadoresPDF(total, confirmados, negociacao, valorAtivo, comPend){
  var kpisHtml = '<div class="kpis">' +
    kpiHtmlImp('Contatos', total) +
    kpiHtmlImp('Confirmados', confirmados, '', 'ok') +
    kpiHtmlImp('Em negociação', negociacao, '', 'warn') +
    kpiHtmlImp('Valor em carteira', brl(valorAtivo)) +
    kpiHtmlImp('Com pendências', comPend, '', comPend?'bad':'ok') +
  '</div>';
  abrirJanelaImpressao('CRM', '', kpisHtml);
}
function renderCRM(){
  var porEtapa = {}, valorAtivo = 0, comPend = 0;
  CRM.forEach(function(c){
    porEtapa[c.etapa] = (porEtapa[c.etapa]||0)+1;
    if (c.etapa!=="perdido" && c.valor_potencial) valorAtivo += c.valor_potencial;
    if (pendencias(c, OBRIG_CRM).length) comPend++;
  });
  var q = CRMFILT.q.toLowerCase();
  var lista = CRM.filter(function(c){
    if (CRMFILT.etapa && c.etapa !== CRMFILT.etapa) return false;
    if (CRMFILT.pend && !pendencias(c, OBRIG_CRM).length) return false;
    if (q && (c.nome+" "+c.grupo+" "+c.telefone+" "+c.interesse+" "+c.cidade+" "+c.observacoes).toLowerCase().indexOf(q)<0) return false;
    return true;
  });

  var html =
    '<div style="display:flex;justify-content:flex-end;margin-bottom:8px">' +
      '<button class="btn2" id="crm_exp_pdf" style="padding:6px 12px;font-size:12px">⇩ Exportar indicadores (PDF)</button>' +
    '</div>' +
    '<div class="kpis">' +
      '<div class="kpi"><small>Contatos</small><b>'+CRM.length+'</b></div>' +
      '<div class="kpi"><small>Confirmados</small><b class="ok">'+(porEtapa.confirmado||0)+'</b></div>' +
      '<div class="kpi"><small>Em negociação</small><b class="warn">'+((porEtapa.lead||0)+(porEtapa.contato||0)+(porEtapa.proposta||0))+'</b></div>' +
      '<div class="kpi"><small>Valor em carteira</small><b>'+brl(valorAtivo)+'</b></div>' +
      '<div class="kpi"><small>Com pendências</small><b class="'+(comPend?'bad':'ok')+'">'+comPend+'</b></div>' +
    '</div>' +
    '<div class="tabs">' +
      '<button class="tab'+(CRMFILT.etapa===""?' on':'')+'" data-etapa="">Todos ('+CRM.length+')</button>' +
      ETAPAS.map(function(e){
        var n = porEtapa[e[0]]||0; if(!n) return "";
        return '<button class="tab'+(CRMFILT.etapa===e[0]?' on':'')+'" data-etapa="'+e[0]+'">'+e[1]+' ('+n+')</button>';
      }).join("") +
      '<button class="tab'+(CRMFILT.pend?' on':'')+'" data-crmpf="pend">⚠ Pendências ('+comPend+')</button>' +
    '</div>' +
    '<input id="crm_q" placeholder="Buscar nome, grupo, telefone, expedição…" value="'+esc(CRMFILT.q)+'" style="margin-bottom:12px">';

  if (!CRM.length) html += '<div class="empty">Nenhum contato ainda. Adicione o primeiro abaixo.</div>';
  else if (!lista.length) html += '<div class="empty">Nenhum contato com essa busca.</div>';

  lista.forEach(function(c){
    var chips = ['<span class="chip '+(ETAPA_CLS[c.etapa]||"")+'">'+(ETAPA_TXT[c.etapa]||c.etapa)+'</span>'];
    var cfC = chipFalta(c, OBRIG_CRM); if (cfC) chips.push(cfC);
    if (c.grupo && c.grupo!==c.nome) chips.push('<span class="chip">'+esc(c.grupo)+'</span>');

function abrirSheet(html){
  $("sheet").innerHTML = html;
  $("overlay").classList.add("on");
  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"), function(b){
    b.onclick = fecharSheet;
  });
}
function fecharSheet(){ $("overlay").classList.remove("on"); $("sheet").innerHTML=""; }
$("overlay").addEventListener("click", function(e){ if (e.target === this) fecharSheet(); });
document.addEventListener("keydown", function(e){ if (e.key==="Escape") fecharSheet(); });

/* Anexos (arquivos em R2) — reusável em qualquer ficha (op_item, campo_tarefa…) */
function apiUpload(path, formData){
  return fetch(path, { method:"POST", headers:{ "x-app-key": KEY }, body: formData })
    .then(function(r){
      if (r.status === 401){ logout(); throw new Error("Chave inválida"); }
      return r.json().then(function(j){
        if (!r.ok) throw new Error(j.erro || ("Erro " + r.status));
        return j;
      });
    });
}
function fmtTamanho(b){
  b = b || 0;
  if (b < 1024) return b+" B";
  if (b < 1024*1024) return Math.round(b/1024)+" KB";
  return (b/1024/1024).toFixed(1)+" MB";
}
function baixarAnexo(id, nome){
  fetch("/api/anexos/"+id+"/arquivo", { headers:{ "x-app-key": KEY } }).then(function(r){
    if (!r.ok) throw new Error("Erro ao baixar o anexo");
    return r.blob();
  }).then(function(blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }).catch(function(e){ toast(e.message, true); });
}
/* Pré-visualização de anexo: abre imagem/PDF direto na tela, sem baixar. Pra
   outros tipos, mostra aviso e deixa só o botão Baixar. */
function visualizarAnexo(id, nome, tipoMime){
  abrirSheet(
    '<h2 class="anton" style="font-size:18px;word-break:break-word">'+esc(nome)+'</h2>'+
    '<div id="anx_preview" style="min-height:120px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px">Carregando…</div>'+
    '<div class="actions"><button class="btn2" data-close>Fechar</button><button class="btn" id="anx_baixar">Baixar</button></div>'
  );
  $("anx_baixar").onclick = function(){ baixarAnexo(id, nome); };
  fetch("/api/anexos/"+id+"/arquivo", { headers:{ "x-app-key": KEY } }).then(function(r){
    if (!r.ok) throw new Error("Erro ao carregar o anexo");
    return r.blob();
  }).then(function(blob){
    var host = $("anx_preview"); if (!host) return;
    var url = URL.createObjectURL(blob);
    if (/^image\//.test(tipoMime||"")){
      host.style.display = "block"; host.textContent = "";
      var img = document.createElement("img");
      img.src = url; img.style.maxWidth = "100%"; img.style.borderRadius = "8px"; img.style.display = "block";
      host.appendChild(img);
    } else if (tipoMime === "application/pdf"){
      host.style.display = "block"; host.style.minHeight = "70vh"; host.textContent = "";
      var frame = document.createElement("iframe");
      frame.src = url; frame.style.width = "100%"; frame.style.height = "70vh"; frame.style.border = "none"; frame.style.borderRadius = "8px";
      host.appendChild(frame);
    } else {
      host.innerHTML = '<div class="meta">Pré-visualização não disponível para este tipo de arquivo — use "Baixar".</div>';
    }
  }).catch(function(e){ var host = $("anx_preview"); if (host) host.innerHTML = '<div class="meta">'+esc(e.message)+'</div>'; });
}
/* v4.45: Nota Fiscal do UTV — variante de arquivo único do sistema de Anexos
   (parent_tipo="cliente_nf_utv"), pra ficar fácil de achar direto na ficha do
   participante. "Substituir" = apaga o anexo atual e sobe o novo no lugar,
   sempre no máximo 1 por participante. */
var NF_UTV_ATUAL = null;
function notaFiscalUtvBlock(){
  return '<label class="top" style="margin-top:20px">Nota Fiscal do UTV</label>'+
    '<div id="nfutv_status" class="meta">Carregando…</div>'+
    '<div style="display:flex;gap:6px;margin-top:10px;align-items:center">'+
      '<input type="file" id="nfutv_file" accept="application/pdf,image/*" style="flex:1">'+
      '<button type="button" class="btn2" id="nfutv_add" style="padding:8px 14px">Enviar</button>'+
    '</div>';
}
function nfUtvStatusHtml(anexo){
  if (!anexo) return '<span class="chip warn">Pendente</span> <span style="color:var(--dim)">nenhuma nota fiscal anexada ainda</span>';
  return '<span class="chip ok">Anexada ✓</span> <span style="color:var(--dim)">'+esc(anexo.nome_arquivo)+' ('+fmtTamanho(anexo.tamanho)+')</span>';
}
function carregarNotaFiscalUtv(clienteId){
  api("/api/anexos?parent_tipo=cliente_nf_utv&parent_id="+clienteId).then(function(j){
    var host = $("nfutv_status"); if (!host) return;
    var atual = (j.anexos||[])[0] || null;
    NF_UTV_ATUAL = atual;
    host.innerHTML = nfUtvStatusHtml(atual) + (atual ?
      '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">'+
        '<button type="button" class="btn2" id="nfutv_ver" style="padding:6px 12px;font-size:12px">Visualizar</button>'+
        '<button type="button" class="btn2" id="nfutv_baixar" style="padding:6px 12px;font-size:12px">Baixar</button>'+
        '<button type="button" class="delx" id="nfutv_del" title="Excluir nota fiscal">×</button>'+
      '</div>' : '');
    var aa = $("nfutv_add"); if (aa) aa.textContent = atual ? "Substituir" : "Enviar";
    var vv = $("nfutv_ver"); if (vv) vv.onclick = function(){ visualizarAnexo(atual.id, atual.nome_arquivo, atual.tipo_mime); };
    var vb = $("nfutv_baixar"); if (vb) vb.onclick = function(){ baixarAnexo(atual.id, atual.nome_arquivo); };
    var vd = $("nfutv_del"); if (vd) vd.onclick = function(){
      if (!confirm("Excluir a nota fiscal do UTV?")) return;
      api("/api/anexos/"+atual.id,"DELETE").then(function(){ toast("Nota fiscal excluída"); carregarNotaFiscalUtv(clienteId); }).catch(function(e){ toast(e.message,true); });
    };
  }).catch(function(e){ var host = $("nfutv_status"); if (host) host.innerHTML = '<span style="color:var(--p1)">'+esc(e.message)+'</span>'; });
}
function ligarNotaFiscalUtv(clienteId){
  carregarNotaFiscalUtv(clienteId);
  var aa = $("nfutv_add");
  if (aa) aa.onclick = function(){
    var fi = $("nfutv_file");
    var f = fi.files && fi.files[0];
    if (!f) return toast("Escolha um arquivo", true);
    if (f.size > 20*1024*1024) return toast("Arquivo maior que 20MB", true);
    aa.disabled = true; aa.textContent = "Enviando…";
    var enviar = function(){
      var fd = new FormData();
      fd.append("arquivo", f);
      fd.append("parent_tipo", "cliente_nf_utv");
      fd.append("parent_id", clienteId);
      fd.append("criado_por", NOME);
      return apiUpload("/api/anexos", fd);
    };
    // substituir = apaga a nota fiscal atual antes de subir a nova
    var antes = NF_UTV_ATUAL ? api("/api/anexos/"+NF_UTV_ATUAL.id,"DELETE") : Promise.resolve();
    antes.then(enviar)
      .then(function(){ fi.value = ""; aa.disabled = false; toast("Nota fiscal anexada"); carregarNotaFiscalUtv(clienteId); })
      .catch(function(e){ aa.disabled = false; aa.textContent = NF_UTV_ATUAL ? "Substituir" : "Enviar"; toast(e.message, true); });
  };
}

        '<button data-anxget="'+a.id+'" data-anxnome="'+esc(a.nome_arquivo)+'" data-anxtipo="'+esc(a.tipo_mime||"")+'" style="flex:1;text-align:left;background:none;border:none;color:var(--mut);font-size:13px;cursor:pointer;padding:0">'+
          esc(a.nome_arquivo)+' <span style="color:var(--dim)">('+fmtTamanho(a.tamanho)+')</span></button>'+
        '<button class="delx" data-anxdel="'+a.id+'" title="Remover anexo">×</button></div>';
    }).join("") : '<div class="meta">Nenhum anexo ainda.</div>';
    Array.prototype.forEach.call(host.querySelectorAll("[data-anxget]"), function(b){
      b.onclick = function(){ visualizarAnexo(b.getAttribute("data-anxget"), b.getAttribute("data-anxnome"), b.getAttribute("data-anxtipo")); };
    });
    Array.prototype.forEach.call(host.querySelectorAll("[data-anxdel]"), function(b){
      b.onclick = function(){
        if (!confirm("Remover este anexo?")) return;
        api("/api/anexos/"+b.getAttribute("data-anxdel"),"DELETE")
          .then(function(){ carregarAnexos(parentTipo, parentId); })
          .catch(function(e){ toast(e.message, true); });
      };
    });
  }).catch(function(e){ var host = $("anx_list"); if (host) host.innerHTML = '<div class="meta">'+esc(e.message)+'</div>'; });
}
function ligarAnexos(parentTipo, parentId){
  carregarAnexos(parentTipo, parentId);
  var aa = $("anx_add");
  if (aa) aa.onclick = function(){
    var fi = $("anx_file");
    var f = fi.files && fi.files[0];
    if (!f) return toast("Escolha um arquivo", true);
    if (f.size > 20*1024*1024) return toast("Arquivo maior que 20MB", true);
    var fd = new FormData();
    fd.append("arquivo", f);
    fd.append("parent_tipo", parentTipo);
    fd.append("parent_id", parentId);
    fd.append("criado_por", NOME);
    aa.disabled = true; aa.textContent = "Enviando…";
    apiUpload("/api/anexos", fd)
      .then(function(){ fi.value = ""; aa.disabled = false; aa.textContent = "Enviar"; carregarAnexos(parentTipo, parentId); })
      .catch(function(e){ aa.disabled = false; aa.textContent = "Enviar"; toast(e.message, true); });
  };
}

function debounce(fn, ms){
  var t; return function(){ var a=arguments, c=this;
    clearTimeout(t); t=setTimeout(function(){ fn.apply(c,a); }, ms); };
}

/* ============================================================
   Boot
   ============================================================ */
if (KEY){
  $("lnome").value = NOME;
  api("/api/me").then(function(me){
    PAPEL = me.papel || "equipe";
    $("app").classList.remove("hide"); route();
  }).catch(function(){ /* logout já tratado no 401 */ 
    $("login").classList.remove("hide");
  });
} else {
  $("login").classList.remove("hide");
  $("lnome").value = NOME;
}
</script>
